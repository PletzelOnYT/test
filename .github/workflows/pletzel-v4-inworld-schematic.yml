name: Pletzel V4 In-world Schematica Import Hologram Smoke
on:
  push:
    branches: [pletzel-v4-schematica-inworld-test]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inworld-schematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use existing original V4 real sound standalone (without test modifications)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42388583490 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-real-audio-runtime-candidate -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
      - name: Chromium WebGL2 with IndexedDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Enter actual singleplayer world, import fixture and inspect hologram
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-inworld-schematica-test.py 2>&1 | tee inworld-schematic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-schematica-real-world-screens
          path: |
            inworld-schematic-evidence/
            inworld-schematic.log
          retention-days: 7
          if-no-files-found: warn
