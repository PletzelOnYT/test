name: Pletzel V4 - inspect actual Schematica renderer and network transport sources (NO COMPILE)
on:
  push:
    branches: [pletzel-v4-multiplayer-terrain-ghost-source-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-current-native-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dicestack88/Eaglercraft-26.2-source
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: engine
      - name: Expand and apply EXACT existing native Schematica renderer, no Java compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          node <<'JS'
          const fs=require('node:fs'),zlib=require('node:zlib'),crypto=require('node:crypto');
          let payload=Buffer.from(fs.readFileSync('pletzel-v4/native-patches.tar.br.b64','utf8').trim(),'base64');
          const h=crypto.createHash('sha256').update(payload).digest('hex');
          if(h!=='bc622e01aafba87d52b50556972e3819a8ae58fad3273818aca7e3c3ddc84af5') throw new Error('native patches mismatch');
          fs.writeFileSync('pletzel-v4/native-patches.tar',zlib.brotliDecompressSync(payload));
          JS
          tar -xf pletzel-v4/native-patches.tar -C pletzel-v4/
          python3 pletzel-v4/apply_to_26_2_source.py engine
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          blob=Path('pletzel-v4/engine-render-repair.py.gz.b64').read_text().strip()
          Path('pletzel-v4/engine-render-repair.py').write_bytes(gzip.decompress(base64.b64decode(blob)))
          PY
          python3 pletzel-v4/engine-render-repair.py engine
          git -C engine diff --check
          cp engine/game/src/main/java/net/pletzel/schematica/SchematicaWorldRenderer.java audit/SchematicaWorldRenderer.java
          cp engine/game/src/main/java/net/minecraft/client/renderer/RenderPipelines.java audit/RenderPipelines.java
          cp engine/game/src/main/java/net/minecraft/client/renderer/rendertype/RenderTypes.java audit/RenderTypes.java
          cp engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/socket/WebSocketPacketBridge.java audit/WebSocketPacketBridge.java
          cp engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/socket/WebSocketPumpPolicy.java audit/WebSocketPumpPolicy.java
          cp engine/game/src/main/java/net/minecraft/client/player/LocalPlayer.java audit/LocalPlayer.java
          cp engine/game/src/main/java/net/minecraft/network/Connection.java audit/Connection.java
          cp engine/game/src/main/java/net/minecraft/client/multiplayer/ClientPacketListener.java audit/ClientPacketListener.java
          cp engine/game/src/main/java/net/minecraft/client/renderer/LevelRenderer.java audit/LevelRenderer.java
          sha256sum audit/*.java > audit/source-sha256.txt
          grep -n -E 'DepthStencil|zOffset|polygonOffset|poseStack|submit|sortOnUpload|PLETZEL_HOLOGRAM|drainOutbound|setEaglerTransport' audit/SchematicaWorldRenderer.java audit/RenderPipelines.java audit/RenderTypes.java audit/WebSocketPacketBridge.java | head -90 > audit/critical-symbols.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-existing-movement-render-source-for-audit
          path: audit/
          retention-days: 30
          if-no-files-found: error
