name: Pletzel V4 Freecam native Controls screen real Chrome scout
on:
  push:
    branches: [pletzel-v4-litematica-freecam-no-voice-20261111]
    paths:
      - '.github/workflows/pletzel-v4-freecam-keybind-ui-scout.yml'
      - 'pletzel-v4/test-freecam-keybind-real-ui.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact native three-mod Freecam HTML
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=43148244757
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = fda42ecd4cf6906de6ab7ddc04a57ed87bcf9f51
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-corrected-shulker-gui-complete-html -D candidate
          test "$(find candidate -iname '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -iname '*.html' | head -1)" | tee exact-html-sha256.txt
      - name: Open real game and capture vanilla Freecam keybind user flow
        shell: bash
        run: |
          set -o pipefail
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install --no-input 'playwright==1.56.0' Pillow
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/test-freecam-keybind-real-ui.py 2>&1 | tee freecam-gui-real-chromium.log
      - name: Upload actual UI screenshots, never claim interaction pass from screenshots alone
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-freecam-real-vanilla-keybind-gui
          path: |
            exact-html-sha256.txt
            freecam-gui-real-chromium.log
            freecam-keybind-real-ui-evidence/
          retention-days: 30
          if-no-files-found: warn
