name: Pletzel V4 corrected dual tooltip browser acceptance (NO REBUILD)
on:
  push:
    branches: [pletzel-v4-map-shulker-acceptance-corrected]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the ONE exactly pinned native Map + Shulker build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42738906471
          expected=70fa22d0f00bc56cb7cd1dcb2ce54fed27a13149
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$expected"
          deadline=$(( $(date +%s) + 5100 ))
          while true; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            echo "Native dual-tooltip compile $run: $status"
            if [ "$status" = completed ]; then
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
              test "$result" = success || { echo "Native compile did not pass: $result"; exit 3; }
              break
            fi
            test "$(date +%s)" -lt "$deadline" || { echo "Timed out waiting for native artifact"; exit 4; }
            sleep 30
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-map-shulker-tooltips-native-complete-html -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          find candidate -name '*.html' -exec sha256sum {} \; | tee dual-tooltip-candidate-sha256.txt
          test "$(find candidate -name '*.html' -exec stat -c %s {} \;)" -gt 85000000
          grep -Flq 'MisterPeModder' "$(find candidate -name '*.html' | head -1)"
          grep -Flq 'VendoAU' "$(find candidate -name '*.html' | head -1)"
      - name: Install actual Chromium/WebGL browser runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' pillow
          python -m playwright install --with-deps chromium
      - name: Test both native tooltip Options controls, ON OFF, and reload persistence
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python pletzel-v4/test-map-shulker-native-settings.py 2>&1 | tee dual-tooltip-settings.log
      - name: Test real maps and empty/populated genuine 27-slot shulker items in actual game
        if: always()
        shell: bash
        run: |
          set -o pipefail
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          xvfb-run -a -s '-screen 0 1280x768x24' python pletzel-v4/test-map-shulker-real-inventory.py 2>&1 | tee dual-tooltip-world.log
      - name: Preserve actual screen pixels and browser diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-map-shulker-corrected-real-browser-evidence
          path: |
            map-shulker-settings-evidence/
            map-shulker-real-inventory-evidence/
            dual-tooltip-settings.log
            dual-tooltip-world.log
            dual-tooltip-candidate-sha256.txt
          retention-days: 30
          if-no-files-found: warn
