name: Pletzel V4 stabilization — repaired exact HTML touch/mouse and Steve/Alex
on:
  push:
    branches: [pletzel-v4-stabilization-unified-voice-20261110]
    paths: ['.github/workflows/pletzel-v4-stabilization-input-skin.yml',
            'pletzel-v4/test-touch-mouse-real-browser.py',
            'pletzel-v4/verify-steve-alex-native-browser.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-binary-controls-skins:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire exact native voice-fixed, four-mod compiled HTML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42966539320
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 33b38b3a24e1751e2ca5b4cc02426c5639964ec4
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-all-four-mods-complete-html -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          test "$(stat -c %s "$(find candidate -name '*.html' | head -1)")" -gt 85000000
          sha256sum "$(find candidate -name '*.html' | head -1)" | tee controls-skins-exact-html-sha256.txt
      - name: Install real Chromium and WebGL software runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' Pillow
          python -m playwright install --with-deps chromium
      - name: Real Chromium pointerType mouse + touchscreen tap switching
        shell: bash
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/test-touch-mouse-real-browser.py 2>&1 | tee controls-touch.log
          result=${PIPESTATUS[0]}
          echo "TOUCH_EXIT=$result" >> "$GITHUB_ENV"
          exit 0
      - name: Genuine native model UI, Alex vs Steve preset geometry
        shell: bash
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/verify-steve-alex-native-browser.py 2>&1 | tee controls-skins.log
          result=${PIPESTATUS[0]}
          echo "SKINS_EXIT=$result" >> "$GITHUB_ENV"
          exit 0
      - name: Report reproducible binary and results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          keys={"real_touch_mouse_pointer_switching":"TOUCH_EXIT","native_steve_alex_model_picker":"SKINS_EXIT"}
          result={k: ("PASS" if os.environ.get(v)=="0" else "UNTESTED" if os.environ.get(v) is None else "FAIL") for k,v in keys.items()}
          report={"binary_sha256":pathlib.Path("controls-skins-exact-html-sha256.txt").read_text().strip() if pathlib.Path("controls-skins-exact-html-sha256.txt").exists() else None,
             "browser":"Playwright Chromium 141 Ubuntu 24.04 Xvfb", "tests":result,
             "limitations":"Does not prove real Chromebook touchscreen, Mac touch hardware or multiplayer skin persistence. Screenshots require semantic review; a pixel change alone cannot prove correct Alex geometry."}
          pathlib.Path("controls-skins-report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-repaired-input-and-skin-evidence
          path: |
            controls-*.log
            controls-*.json
            controls-skins-exact-html-sha256.txt
            touch-mouse-evidence/
            profile-model-evidence/
          if-no-files-found: warn
          retention-days: 21
      - name: Strict input/skin acceptance — no green on test failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${TOUCH_EXIT:-UNTESTED}" = 0
          test "${SKINS_EXIT:-UNTESTED}" = 0
          echo "Both real-browser input/skin smoke tests executed successfully. Full release not accepted."
