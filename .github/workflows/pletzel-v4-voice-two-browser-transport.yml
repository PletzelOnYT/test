name: Pletzel Voice REAL WebRTC transport between two browser profiles (synthetic mic, NO ENGINE REBUILD)
on:
  push:
    branches: [pletzel-v4-voice-proximity-experimental]
    paths:
      - '.github/workflows/pletzel-v4-voice-two-browser-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-webrtc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd pletzel-v4/voice/gateway && npm install --no-audit --no-fund
          cd ../../..
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test REAL WebRTC SDP ICE and bidirectional RTP between two Chromium contexts
        shell: bash
        run: |
          set -o pipefail
          python pletzel-v4/voice/tests/browser_two_peer.py 2>&1 | tee voice-browser-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-voice-two-chromium-synthetic-audio-evidence
          path: |
            voice-browser-evidence/
            voice-browser-runtime.log
          retention-days: 30
          if-no-files-found: warn
