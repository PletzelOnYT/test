name: Pletzel V4 Standalone Packaging Fix - Real Audio + In-World Probe
on:
  push:
    branches: [pletzel-v4-singleplayer-repair]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repaired-standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain already-linked V4 and independently validated real 26.2 sound EPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42342196510 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-build-intermediate-needs-v3-sounds -D original
          gh run download 42388205614 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-public-real-26-2-sounds -D audio
          test -s audio/sounds.epk
      - name: Embed genuine sounds and release-grade inline XHR support
        run: |
          mkdir -p candidate
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          payload=base64.b64decode(Path('pletzel-v4/repair_packaging.py.gz.b64').read_text().strip())
          Path('repack.py').write_bytes(gzip.decompress(payload))
          PY
          original=$(find original -type f -name '*Schematica*CANDIDATE.html' | head -1)
          test -n "$original"
          python3 repack.py --input "$original" --sounds audio/sounds.epk --output candidate/eaglercraft-26.2-Pletzel-v4-Schematica-packaging-CANDIDATE.html
          test -s candidate/eaglercraft-26.2-Pletzel-v4-Schematica-packaging-CANDIDATE.html
          sha256sum candidate/*.html | tee standalone-sha256.txt
      - name: Install Chromium with WebGL2 and IndexedDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test unchanged repackaged HTML in real browser and attempt singleplayer world
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-singleplayer-probe.py 2>&1 | tee repaired-probe.log
      - name: Upload complete in-browser evidence on failure and success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-real-audio-singleplayer-probe
          path: |
            singleplayer-evidence/
            repaired-probe.log
            standalone-sha256.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Upload test-only compiled candidate (not gameplay certified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-real-audio-runtime-candidate
          path: candidate/*.html
          retention-days: 7
          if-no-files-found: error
