name: Pletzel V4 no-voice four-format real-browser acceptance
on:
  push:
    branches: [pletzel-v4-litematica-freecam-no-voice-20261111, pletzel-v4-freecam-direction-settings-isolated-20261111]
    paths: ['.github/workflows/pletzel-v4-fourformat-freecam-acceptance.yml', 'pletzel-v4/test-fourformat-browser-smoke.py', 'pletzel-v4/make-fourformat-fixtures.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact no-voice candidate from pinned successful native build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=43150652898
          expected_sha=3861f72a3c50311d349e512f767eb6251d521152
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$expected_sha"
          deadline=$(( $(date +%s) + 6900 ))
          while true; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
              test "$conclusion" = success || { echo "BLOCKED: exact native build failed: $conclusion"; exit 2; }
              break
            fi
            test "$(date +%s)" -lt "$deadline" || exit 3
            sleep 25
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-corrected-shulker-gui-complete-html -D candidate
          test "$(find candidate -iname '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -iname '*.html' | head -1)" | tee exact-html-sha256.txt
      - name: Generate and check four formats plus six stress volumes
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/make-fourformat-fixtures.py /tmp/schematic-test-fixtures
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          d=Path('/tmp/schematic-test-fixtures')
          names=['basic.schematic','basic.schem','basic.litematic','basic.nbt']
          names += [f'stress-{n}.schem' for n in (4000,10000,50000,100000,500000,1000000)]
          assert all(gzip.decompress((d/x).read_bytes()).startswith(b'\x0a\x00\x00') for x in names)
          assert (d/'bad.schem').read_bytes()==b'not-a-valid-nbt'
          print('VALIDATED:',len(names),'binary NBT fixture containers')
          PY
      - name: Real Chromium WebGL2 and file chooser interactions
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install --no-input 'playwright==1.56.0' Pillow
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/test-fourformat-browser-smoke.py 2>&1 | tee fourformat-real-browser.log
      - name: Record remaining unsupported acceptance claims
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          r={'format_rendering_correctness':'UNVERIFIED','freecam_keybind_and_network_packet_integrity':'UNVERIFIED',
             'stress_memory_stability':'UNVERIFIED','physical_mac_and_multiplayer':'UNVERIFIED','full_release_accepted':False}
          pathlib.Path('fourformat-acceptance-remaining.json').write_text(json.dumps(r,indent=2))
          print(r)
          PY
      - name: Upload real evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-no-voice-fourformat-real-chrome-evidence
          path: |
            exact-html-sha256.txt
            fourformat-real-browser.log
            fourformat-acceptance-remaining.json
            fourformat-browser-evidence/
          retention-days: 30
          if-no-files-found: warn
