name: Pletzel V4 Schematica - compile native engine
on:
  push:
    branches: [pletzel-v4-schematica-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EAGLER_BUILD_CAP_MIB: '13312'
      EAGLER_LINK_HEAP_MIB: '12288'
      CANDIDATE: eaglercraft-26.2-vanilla-stability-Pletzel-v4-Schematica-CANDIDATE.html
    steps:
      - name: Checkout isolated integration kit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned public 26.2 source
        uses: actions/checkout@v4
        with:
          repository: dicestack88/Eaglercraft-26.2-source
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: engine
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record runtime resources and source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          { java -version; node --version; free -h; df -h .; git -C engine rev-parse HEAD; cat engine/gradle/wrapper/gradle-wrapper.properties; } 2>&1 | tee logs/environment.log
          test "$(git -C engine rev-parse HEAD)" = "f73bff91f0f0840bc958c09ab536dbba1e146b2e"
          mem=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          disk=$(df -Pm . | awk 'NR==2 {print $4}')
          if (( mem < 14500 || disk < 10000 )); then
            echo "INSUFFICIENT_RESOURCES: RAM=${mem}MiB DISK=${disk}MiB" | tee logs/preflight-failure.log
            exit 3
          fi
      - name: Verify and extract the existing Pletzel V4 Java source archive
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const payload = Buffer.from(fs.readFileSync('pletzel-v4/native-patches.tar.br.b64', 'utf8').trim(), 'base64');
          const hash = crypto.createHash('sha256').update(payload).digest('hex');
          const expected = 'bc622e01aafba87d52b50556972e3819a8ae58fad3273818aca7e3c3ddc84af5';
          if (hash !== expected) throw new Error('Patch archive sha256 mismatch: '+hash);
          fs.writeFileSync('pletzel-v4/native-patches.tar',zlib.brotliDecompressSync(payload));
          console.log('Verified pre-existing native patch archive:',payload.length,'B, sha256',hash);
          JS
          tar -tf pletzel-v4/native-patches.tar | tee logs/native-source-list.txt
          tar -xf pletzel-v4/native-patches.tar -C pletzel-v4/
      - name: Dry-run and apply original native renderer/menu patch
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/apply_to_26_2_source.py engine --dry-run 2>&1 | tee logs/patch-dry-run.log
          python3 pletzel-v4/apply_to_26_2_source.py engine 2>&1 | tee logs/patch-apply.log
          grep -F 'SchematicaWorldRenderer.submit(' engine/game/src/main/java/net/minecraft/client/renderer/LevelRenderer.java
          grep -F 'Optimized by Pletzel' engine/game/src/main/java/net/minecraft/client/gui/screens/TitleScreen.java
      - name: Fix verified 26.2 colored block API difference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/game/src/main/java/net/pletzel/schematica/SchematicaSession.java')
          src=p.read_text()
          before='Blocks.WHITE_WOOL.defaultBlockState()'
          after='Blocks.WOOL.white().defaultBlockState()'
          assert src.count(before)==1, 'unexpected Java mapping source; refuse edit'
          src=src.replace(before,after,1)
          p.write_text(src)
          print('FIXED: Minecraft 26.2 ColorCollection<Block> WOOL.white()')
          PY
      - name: Install npm lockfile dependencies
        shell: bash
        working-directory: engine
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ../logs/npm.log
      - name: Compile game with native Schematica
        shell: bash
        working-directory: engine
        run: |
          set -o pipefail
          bash ./gradlew :game:jar --console=plain --no-daemon --stacktrace 2>&1 | tee ../logs/game-compile.log
      - name: Verify compiled Schematica classes
        shell: bash
        run: |
          set -euo pipefail
          jarfile=$(find engine/game/build/libs -maxdepth 1 -type f -name '*.jar' | head -1)
          test -n "$jarfile"
          jar tf "$jarfile" > logs/compiled-jar-entries.txt
          for cls in SchematicaSession SchematicaWorldRenderer SchematicaScreen; do
            grep -Fx "net/pletzel/schematica/${cls}.class" logs/compiled-jar-entries.txt
          done
          echo "All native Schematica classes compiled into game JAR"
      - name: Link precise TeaVM/Wasm-GC and package standalone HTML
        shell: bash
        working-directory: engine
        run: |
          set -o pipefail
          node wasm-toolchain/build-single-html.js --fast-package --output "$CANDIDATE" 2>&1 | tee ../logs/full-wasm-link.log
      - name: Validate compiled WebAssembly and record candidate
        shell: bash
        run: |
          set -euo pipefail
          wasm=engine/target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm
          test -s "$wasm"
          node - "$wasm" <<'JS' | tee logs/wasm-validation.log
          const fs = require('node:fs'),crypto=require('node:crypto');
          const bytes=fs.readFileSync(process.argv[2]);
          const mod=new WebAssembly.Module(bytes);
          console.log('VALID WASM',bytes.length,'sha256',crypto.createHash('sha256').update(bytes).digest('hex'));
          console.log('imports',WebAssembly.Module.imports(mod).length,'exports',WebAssembly.Module.exports(mod).length);
          console.log('WARNING: compatibility with Pletzel V3 and hologram gameplay NOT VERIFIED');
          JS
          cp "$wasm" engine/Pletzel-v4-compiled.wasm
          test -s "engine/$CANDIDATE"
          sha256sum "$wasm" "engine/$CANDIDATE" | tee logs/artifact-sha256.txt
      - name: Upload actual logs even on build failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-schematica-build-logs
          path: logs/
          if-no-files-found: warn
      - name: Upload candidate only when compiler and linker succeed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-unverified-compiled-candidate
          path: |
            engine/${{ env.CANDIDATE }}
            engine/Pletzel-v4-compiled.wasm
          retention-days: 14
          if-no-files-found: error
