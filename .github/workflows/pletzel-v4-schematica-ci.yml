name: Pletzel V4 Schematica CI - Java 25 build probe
on:
  push:
    branches: [pletzel-v4-schematica-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java25-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dicestack88/Eaglercraft-26.2-source
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record runner and source version
        shell: bash
        run: |
          mkdir -p logs
          { java -version; node --version; free -h; df -h .; cat engine/gradle/wrapper/gradle-wrapper.properties; git -C engine rev-parse HEAD; } 2>&1 | tee logs/environment.log
      - name: Compile baseline engine to identify toolchain failures
        shell: bash
        working-directory: engine
        run: |
          set -o pipefail
          bash ./gradlew :game:compileJava --console=plain --no-daemon --stacktrace 2>&1 | tee ../logs/java-compile.log
      - name: Upload logs regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-java25-probe-logs
          path: logs/
