name: Pletzel V4 Root Fix - Creative World UI for Comparison Testing
on:
  push:
    branches: [pletzel-v4-root-block-comparison]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch EXACT final-rootfix compiled HTML (no modification)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42392345185 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-singleplayer-root-fixed-html-candidate -D candidate
          f=$(find candidate -name '*.html' | head -1)
          echo "510c41635be41ff62ac1ebe05eb0b810ca7d6dcacfcfc0d2150c3e56378f0e5d  $f" | sha256sum -c -
      - name: Setup Chromium WebGL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Inspect actual creative world-creation menu
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-create-world-creative-navigation.py 2>&1 | tee root-navigation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-root-creative-world-UI
          path: |
            comparison-navigation/
            root-navigation.log
          retention-days: 7
