name: Pletzel V4 official EaglerX voice browser smoke (NO ENGINE BUILD)
on:
  push:
    branches: [pletzel-v4-eaglerx-voice-browser-evidence]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse exact already-compiled official EaglerX voice HTML
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=42756876274
          expected=4342c328ed5fab6b7e9b3be0704d5e98f9eab12b
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$expected"
          deadline=$(( $(date +%s) + 4800 ))
          while true; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            echo "Official EaglerX V5 WASM build $run: $status"
            if [ "$status" = completed ]; then
              outcome="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
              test "$outcome" = success || exit 3
              break
            fi
            test "$(date +%s)" -lt "$deadline" || exit 4
            sleep 30
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-eaglerx-v5-voice-native-complete-html -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          test "$(find candidate -name '*.html' -exec stat -c %s {} \;)" -gt 85000000
          find candidate -name '*.html' -exec sha256sum {} \; | tee eagler-voice-candidate-sha256.txt
      - name: Install real Chromium and WebGL2 environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' pillow
          python -m playwright install --with-deps chromium
      - name: Launch actual Pletzel game, check native menus and off-by-default microphone
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python pletzel-v4/test-official-eagler-voice-browser-smoke.py 2>&1 | tee real-eagler-voice-browser.log
      - name: Preserve screenshots, microphone request audit, and any browser errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-official-eaglerx-voice-real-browser-evidence
          path: |
            eaglerx-v5-voice-browser-evidence/
            real-eagler-voice-browser.log
            eagler-voice-candidate-sha256.txt
          retention-days: 30
          if-no-files-found: warn
