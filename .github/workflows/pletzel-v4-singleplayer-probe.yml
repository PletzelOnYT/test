name: Pletzel V4 Unmodified Singleplayer Browser Probe
on:
  push:
    branches: [pletzel-v4-singleplayer-repair]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser-singleplayer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Fetch last compiled V4, no HTML modification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42342196510 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-build-intermediate-needs-v3-sounds -D candidate
          test "$(find candidate -type f -name '*Schematica*CANDIDATE.html' | wc -l)" -eq 1
      - name: Probe REAL new singleplayer world with WebGL2 and IndexedDB
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-singleplayer-probe.py 2>&1 | tee singleplayer-probe.log
      - name: Upload captured screens and telemetry even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-singleplayer-unmodified-probe
          path: |
            singleplayer-evidence/
            singleplayer-probe.log
          retention-days: 7
          if-no-files-found: warn
