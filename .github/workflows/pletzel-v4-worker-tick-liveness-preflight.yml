name: Pletzel V4 - Probe exact TeaVM server tick wakeup fallback (NO game compilation)
on:
  push:
    branches: [pletzel-v4-tick-wakeup-liveness-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-source-and-browser-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dicestack88/Eaglercraft-26.2-source
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only source verified native worker @Async wake guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pletzel-v4/repair-hosted-server-tick-wakeup.py
          python3 pletzel-v4/repair-hosted-server-tick-wakeup.py engine
          git -C engine diff --check
          git -C engine diff --stat | tee source-diff-stat.txt
          git -C engine diff -- platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/internal/ServerPlatformSingleplayer.java > native-worker-tick-wakeup.diff
          test -s native-worker-tick-wakeup.diff
      - name: Execute exact patched browser JavaScript in 4 synthetic scheduler failure modes
        shell: bash
        run: |
          set -euo pipefail
          node pletzel-v4/test-hosted-server-tick-wakeup.mjs engine/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/internal/ServerPlatformSingleplayer.java | tee scheduler-fallback-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-worker-tick-wakeup-no-compile-proof
          path: |
            native-worker-tick-wakeup.diff
            source-diff-stat.txt
            scheduler-fallback-test.log
          retention-days: 30
          if-no-files-found: warn
