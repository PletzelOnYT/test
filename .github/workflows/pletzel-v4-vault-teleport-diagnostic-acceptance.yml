name: Pletzel V4 - Strict vault and destination FULL future diagnostic gameplay acceptance
on:
  push:
    branches: [pletzel-v4-vault-teleport-diagnostic-acceptance-run]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare-provenance:
    name: Wait for EXACT prior diagnostic compile and verify its immutable SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      upstream_commit: ${{ steps.identity.outputs.upstream_commit }}
    steps:
      - name: Wait for existing single diagnostic link, do NOT launch a build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42439505642
          expected_commit=96c1885022a287e944f0975e2fe1ea296a29a398
          upstream_commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha')"
          test "$upstream_commit" = "$expected_commit"
          deadline=$(( $(date +%s) + 8400 ))
          while true; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status')"
            echo "existing build $run state=$state"
            if [ "$state" = completed ]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')"
              test "$conclusion" = success || { echo "Existing diagnostic compile failed: $conclusion"; exit 2; }
              break
            fi
            test "$(date +%s)" -lt "$deadline" || { echo 'Existing compile exceeded provenance gate'; exit 3; }
            sleep 30
          done
      - name: Independently compare exact HTML bytes with SHA published by compiler
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=42439505642
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-vault-teleport-diagnostic-compile-logs -D compiler-evidence
          expected_file="$(find compiler-evidence -type f -name artifact-sha256.txt)"
          test -s "$expected_file"
          sha="$(awk '$2 ~ /\.html$/ {print $1}' "$expected_file")"
          test "${#sha}" -eq 64
          mkdir -p prepared-candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-vault-teleport-diagnostic-html-candidate -D prepared-candidate
          mapfile -t htmls < <(find prepared-candidate -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' "$sha" "${htmls[0]}" | sha256sum -c -
          test "$(stat -c '%s' "${htmls[0]}")" -gt 85000000
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=96c1885022a287e944f0975e2fe1ea296a29a398" >> "$GITHUB_OUTPUT"
          cp "$expected_file" compiler-published-artifact-sha256.txt
          sha256sum "${htmls[0]}" > independently-verified-html.sha256
          printf '%s\n' "$sha" > pinned-html.sha256
          echo "SHA verified against independently uploaded compilation log: $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-diagnostic-immutable-input-provenance
          path: |
            compiler-published-artifact-sha256.txt
            independently-verified-html.sha256
            pinned-html.sha256
          retention-days: 30
          if-no-files-found: error
  compiled-html-browser:
    needs: prepare-provenance

    name: diagnostic / ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [survival, onecpu, remote, chicken, vault, lifecycle, schematica]
    env:
      TEST_KIND: ${{ matrix.test }}
      VARIANT: diagnostic
      GAMEPLAY_SECONDS: '195'
      CPU_SLOWDOWN: '1'
      PIN_ONE_CPU: ${{ matrix.test == 'onecpu' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact previously compiled native V4 diagnostic, verify pinned SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42439505642
          artifact=pletzel-v4-vault-teleport-diagnostic-html-candidate
          sha="${{ needs.prepare-provenance.outputs.sha }}"
          test "${#sha}" -eq 64
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D candidate
          mapfile -t htmls < <(find candidate -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' "$sha" "${htmls[0]}" | sha256sum -c -
          test "$(stat -c '%s' "${htmls[0]}")" -gt 85000000
          sha256sum "${htmls[0]}" | tee candidate-sha256.txt
          python - "$run" "$artifact" "$sha" <<'PY'
          import json,sys
          run,artifact,sha=sys.argv[1:]
          with open('candidate-identity.json','w') as f:
              json.dump({'build_run':int(run),'artifact':artifact,'html_sha256':sha,
                  'integration_branch':'pletzel-v4-vault-teleport-diagnostic-build',
                  'binary_modified':False},f,indent=2)
          PY
      - name: Install actual Chromium, WebGL2 and WASM-GC runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Execute real singleplayer tests with original compiled HTML
        shell: bash
        run: |
          set -o pipefail
          case "$TEST_KIND" in
            survival|onecpu) script=vault-acceptance/pletzel-v4-singleplayer-pressure.py ;;
            remote) script=vault-acceptance/pletzel-v4-diagnostic-remote-teleport.py ;;
            chicken) script=vault-acceptance/pletzel-v4-player-hit-arena-v3.py ;;
            vault) script=pletzel-v4-vault-mechanics-real-browser.py ;;
            lifecycle) script=vault-acceptance/pletzel-v4-lifecycle.py ;;
            schematica) script=pletzel-v4-inworld-schematica-test.py ;;
            *) exit 3 ;;
          esac
          xvfb-run -a -s '-screen 0 1280x720x24' python "$script" 2>&1 | tee browser-console.log
      - name: Aggregate real heartbeat TPS, queue, chunk stalls and exception data
        if: always()
        run: python vault-acceptance/analyze-candidate-gameplay.py | tee test-analysis-console.log
      - name: Apply strict server-authoritative gameplay and stall acceptance gate
        shell: bash
        run: |
          python vault-acceptance/strict-evidence-gate.py | tee strict-evidence-console.log
      - name: Keep raw screenshots and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-diagnostic-acceptance-${{ matrix.test }}
          retention-days: 30
          if-no-files-found: error
          path: |
            candidate-sha256.txt
            candidate-identity.json
            candidate-metrics.json
            browser-console.log
            test-analysis-console.log
            strict-evidence-console.log
            strict-evidence-gate.json
            singleplayer-pressure-evidence/
            cheats-entity-evidence/
            lifecycle-evidence/
            inworld-schematic-evidence/
