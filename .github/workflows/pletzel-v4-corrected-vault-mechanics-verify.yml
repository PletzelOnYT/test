name: Pletzel V4 - Correct real Vault property, trial-key and reward test (exact compiled HTML)
on:
  push:
    branches: [pletzel-v4-corrected-vault-mechanics-verify]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vanilla-vault-mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      TEST_KIND: vault
      VARIANT: exact-diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original full standalone HTML, not a new compile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pletzel-v4-vault-mechanics-real-browser.py vault-acceptance/strict-evidence-gate.py
          grep -F 'minecraft:vault[vault_state=active]' pletzel-v4-vault-mechanics-real-browser.py
          mkdir -p candidate
          gh run download 42439505642 -R "$GITHUB_REPOSITORY" -n pletzel-v4-vault-teleport-diagnostic-html-candidate -D candidate
          mapfile -t htmls < <(find candidate -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' 4a8bef5b7229580df7867bb6f62fce352842107a35082221d1cb6e5c517e5abd "${htmls[0]}" | sha256sum -c -
          sha256sum "${htmls[0]}" | tee candidate-sha256.txt
      - name: Install actual Chromium WebGL2, Wasm-GC, IndexedDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Real native vault ACTIVE property + trial-key right click + loot ejection
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-vault-mechanics-real-browser.py 2>&1 | tee browser-console.log
      - name: Reject red syntax-error echoes and enforce actual server state and rewards
        shell: bash
        run: |
          set -o pipefail
          python vault-acceptance/strict-evidence-gate.py 2>&1 | tee strict-evidence-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-corrected-vault-native-blockstate-reward-evidence
          path: |
            candidate-sha256.txt
            browser-console.log
            strict-evidence-console.log
            strict-evidence-gate.json
            cheats-entity-evidence/
          retention-days: 30
          if-no-files-found: error
