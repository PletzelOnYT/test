name: Pletzel V4 exact HTML — real server/client teleport synchronization
on:
  push:
    branches: [pletzel-v4-stabilization-unified-voice-20261110]
    paths:
      - '.github/workflows/pletzel-v4-stabilization-teleport-sync.yml'
      - 'pletzel-v4/accept-unified-teleport-sync.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  two-distant-teleports:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact native game binary — no source rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42966539320
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 33b38b3a24e1751e2ca5b4cc02426c5639964ec4
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-all-four-mods-complete-html -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -name '*.html' | head -1)" | tee teleport-sync-exact-html-sha256.txt
          grep -q '^4813cce2c056089b85f6e296c122095e7791f5b68f9966a06a6e6c0d79b5e0af ' teleport-sync-exact-html-sha256.txt
      - name: Run actual headed Chromium and real WebGL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' Pillow
          python -m playwright install --with-deps chromium
          python -m py_compile pletzel-v4/accept-unified-teleport-sync.py
      - name: Two real Minecraft teleports and end-to-end server/client proof
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/accept-unified-teleport-sync.py 2>&1 | tee teleport-real-sync.log
      - name: Preserve unmodified exact HTML hash, server/client logs and genuine screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-real-authoritative-teleport-sync-evidence
          path: |
            teleport-sync-exact-html-sha256.txt
            teleport-real-sync.log
            teleport-real-sync-evidence/
          retention-days: 21
          if-no-files-found: warn
