name: Pletzel V4 Reproduce Singlethread Worker-Selection Mismatch
on:
  push:
    branches: [pletzel-v4-worker-mode-repro]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mismatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch existing compiled client with valid real sound assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42388583490 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-real-audio-runtime-candidate -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Reproduce discrepancy using query singlethread against unchanged HTML
        run: |
          sed -i 's/?perfdebug"/?singlethread\&perfdebug"/g' pletzel-v4-inworld-autotest.py
          sed -i "s/?perfdebug'/?singlethread\&perfdebug'/g" pletzel-v4-inworld-autotest.py
          grep -n 'singlethread' pletzel-v4-inworld-autotest.py
      - name: Enter singleplayer world and capture worker storage failure
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-inworld-autotest.py 2>&1 | tee singlethread-repro.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-singlethread-worker-mismatch-evidence
          path: |
            singleplayer-inworld-evidence/
            singlethread-repro.log
          retention-days: 7
          if-no-files-found: warn
