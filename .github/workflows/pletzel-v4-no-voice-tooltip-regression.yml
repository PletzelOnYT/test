name: Pletzel V4 no-voice Map and Shulker real-browser regressions
on:
  push:
    branches: [pletzel-v4-litematica-freecam-no-voice-20261111]
    paths:
      - '.github/workflows/pletzel-v4-no-voice-tooltip-regression.yml'
      - 'pletzel-v4/test-no-voice-map-shulker-regression.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chrome-map-shulker:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin and download exact compiled no-voice standalone HTML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=43143377675
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 6fa545d622bfb890d514c77d657fb05e83ecfda1
          deadline=$(( $(date +%s) + 6900 ))
          while true; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            if [ "$state" = completed ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
              break
            fi
            test "$(date +%s)" -lt "$deadline"
            sleep 25
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-corrected-shulker-gui-complete-html -D candidate
          test "$(find candidate -iname '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -iname '*.html' | head -1)" | tee exact-tooltip-html-sha256.txt
      - name: Test actual Minecraft filled maps and populated Shulker GUI in Chromium
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install --no-input 'playwright==1.56.0' Pillow
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/test-no-voice-map-shulker-regression.py 2>&1 | tee exact-tooltip-regression.log
      - name: Upload screenshots and errors whether passing or failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-no-voice-real-map-shulker-regression
          path: |
            exact-tooltip-html-sha256.txt
            exact-tooltip-regression.log
            map-shulker-real-inventory-evidence/
          if-no-files-found: warn
          retention-days: 30
