name: Pletzel V4 - Entity movement and world time authority diagnostics
on:
  push:
    branches: [pletzel-v4-entity-simulation-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-entity-commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download unchanged compiled engine candidate; checksum must match
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42408817655 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-singleplayer-engine-tpsed-html-candidate -D candidate
          mapfile -t htmls < <(find candidate -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' '1c95670852c5e1241cd78fd6646b8091ebb4aed81d5eafac32dc0761e01fc6ef' "${htmls[0]}" | sha256sum --check
          sha256sum "${htmls[0]}" > candidate-sha256.txt
      - name: Install WebGL2 Chromium and IndexedDB browser environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Observe unmodified server authority with in-game commands and entity screenshots
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-entity-authority-test.py 2>&1 | tee entity-test-console.log
      - name: Preserve all screenshots, server metrics, and command feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-entity-authority-original-binary
          retention-days: 30
          if-no-files-found: warn
          path: |
            candidate-sha256.txt
            entity-test-console.log
            entity-authority-evidence/
