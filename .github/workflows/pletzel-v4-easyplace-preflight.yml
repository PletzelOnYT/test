name: Pletzel V4 Easy Place source and browser-test preflight
on:
  push:
    branches: [pletzel-v4-easyplace-mapart-red-20261112]
    paths:
      - '.github/workflows/pletzel-v4-easyplace-preflight.yml'
      - 'pletzel-v4/EasyPlace26.java'
      - 'pletzel-v4/MapArtStore26.java'
      - 'pletzel-v4/test-red-highlight-real-chrome.py'
      - 'pletzel-v4/test-persistent-mapart-chrome.py'
      - 'pletzel-v4/test-easyplace-real-chrome.py'
      - 'pletzel-v4/publish-easyplace-no-voice.sh'
      - 'pletzel-v4/patch-easyplace-mapart.py'
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python and shell parse, source policy invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            pletzel-v4/patch-easyplace-mapart.py \
            pletzel-v4/test-easyplace-mapart-source.py \
            pletzel-v4/test-easyplace-real-chrome.py \
            pletzel-v4/test-persistent-mapart-chrome.py \
            pletzel-v4/test-red-highlight-real-chrome.py \
            pletzel-v4/test-mods-separation-real-chrome.py \
            pletzel-v4/test-optimized-hologram-performance.py
          bash -n pletzel-v4/publish-easyplace-no-voice.sh
          grep -Fq 'private static BlockPos aimedGhost(Minecraft mc)' pletzel-v4/EasyPlace26.java
          grep -Fq 'ClipContext.Block.COLLIDER' pletzel-v4/EasyPlace26.java
          grep -Fq 'CLIENT_WORLD_MATCHED' pletzel-v4/EasyPlace26.java
          ! grep -Fq '"Map Tooltip Settings"' pletzel-v4/SchematicaScreenRestored26.java
          grep -Fq 'new PletzelMapArtSettings26(this)' pletzel-v4/PletzelModsScreen26.java
          grep -Fq 'EagRuntime.setStorage(k,output)' pletzel-v4/MapArtStore26.java
          grep -Fq 'cell.wrongQuads()' pletzel-v4/SchematicaWorldRendererOptimized26.java
          test "$(grep -c 'suite: \[easyplace, mapart, red-highlight, fourformat, freecam, hologram, world-save, mods\]' .github/workflows/pletzel-v4-easyplace-chrome-acceptance.yml)" -eq 1
          echo 'SOURCE_PREFLIGHT_OK: test scripts parse; vanilla placement/real art/red overlays referenced'
