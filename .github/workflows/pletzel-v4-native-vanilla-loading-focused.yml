name: Pletzel V4 - actual vanilla loading and truthful chunk status focused browser QA
on:
  push:
    branches: [pletzel-v4-vanilla-loading-focused-tests]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare-provenance:
    name: Verify EXACT new release-candidate compiled source and SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      upstream_commit: ${{ steps.identity.outputs.upstream_commit }}
    steps:
      - name: Wait for existing single diagnostic link, do NOT launch a build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42534915271
          expected_commit=7528b0d28cc8b45695cd1707abdfe8d2f4af5ee0
          upstream_commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha')"
          test "$upstream_commit" = "$expected_commit"
          deadline=$(( $(date +%s) + 8400 ))
          while true; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status')"
            echo "existing build $run state=$state"
            if [ "$state" = completed ]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')"
              test "$conclusion" = success || { echo "Existing diagnostic compile failed: $conclusion"; exit 2; }
              break
            fi
            test "$(date +%s)" -lt "$deadline" || { echo 'Existing compile exceeded provenance gate'; exit 3; }
            sleep 30
          done
      - name: Independently compare exact HTML bytes with SHA published by compiler
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=42534915271
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-native-vanilla-loading-compile-logs -D compiler-evidence
          expected_file="$(find compiler-evidence -type f -name artifact-sha256.txt)"
          test -s "$expected_file"
          sha="$(awk '$2 ~ /\.html$/ {print $1}' "$expected_file")"
          test "${#sha}" -eq 64
          test "$sha" != "7d610dbda76fbe80992793869f92b1f8d11d4b997aeb6b8cc2b95a7d15e22c0e" # older unrepaired binary not allowed
          test "$sha" != "3c149fa6dc419ba97f20387250458d715ba6a46b6fef49883e9ad9024abc1deb" # rejected exact previous four-bug native HTML
          mkdir -p prepared-candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-native-vanilla-loading-complete-html -D prepared-candidate
          mapfile -t htmls < <(find prepared-candidate -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' "$sha" "${htmls[0]}" | sha256sum -c -
          test "$(stat -c '%s' "${htmls[0]}")" -gt 85000000
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=7528b0d28cc8b45695cd1707abdfe8d2f4af5ee0" >> "$GITHUB_OUTPUT"
          cp "$expected_file" compiler-published-artifact-sha256.txt
          sha256sum "${htmls[0]}" > independently-verified-html.sha256
          printf '%s\n' "$sha" > pinned-html.sha256
          echo "SHA verified against independently uploaded compilation log: $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-native-vanilla-loading-immutable-input-provenance
          path: |
            compiler-published-artifact-sha256.txt
            independently-verified-html.sha256
            pinned-html.sha256
          retention-days: 30
          if-no-files-found: error
  compiled-html-browser:
    needs: prepare-provenance

    name: native-vanilla-loading / ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [survival, onecpu, remote, lifecycle, schematica]
    env:
      TEST_KIND: ${{ matrix.test }}
      VARIANT: native-vanilla-loading
      GAMEPLAY_SECONDS: '195'
      CPU_SLOWDOWN: '1'
      PIN_ONE_CPU: ${{ matrix.test == 'onecpu' && '1' || '0' }}
      WORLD_SEED: ${{ matrix.test == 'remote2' && '987654321' || matrix.test == 'remote3' && '135791357' || matrix.test == 'remote4' && '246813579' || '246813579' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight all real browser scripts and evidence gates before downloading the immutable game
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            vault-acceptance/analyze-candidate-gameplay.py \
            vault-acceptance/strict-evidence-gate.py \
            vault-acceptance/pletzel-v4-singleplayer-pressure.py \
            vault-acceptance/pletzel-v4-diagnostic-remote-teleport.py \
            vault-acceptance/pletzel-v4-lifecycle.py \
            pletzel-v4-inworld-schematica-test.py; do
            test -s "$script" || { echo "::error::Missing mandatory test file $script"; exit 2; }
          done
          python -m py_compile vault-acceptance/*.py
          echo "Test harness present; compilation is NOT gameplay verification."
      - name: Recover exact previously compiled native V4 diagnostic, verify pinned SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42534915271
          artifact=pletzel-v4-native-vanilla-loading-complete-html
          sha="${{ needs.prepare-provenance.outputs.sha }}"
          test "${#sha}" -eq 64
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D candidate
          mapfile -t htmls < <(find candidate -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' "$sha" "${htmls[0]}" | sha256sum -c -
          test "$(stat -c '%s' "${htmls[0]}")" -gt 85000000
          sha256sum "${htmls[0]}" | tee candidate-sha256.txt
          python - "$run" "$artifact" "$sha" <<'PY'
          import json,sys
          run,artifact,sha=sys.argv[1:]
          with open('candidate-identity.json','w') as f:
              json.dump({'build_run':int(run),'artifact':artifact,'html_sha256':sha,
                  'integration_branch':'pletzel-v4-native-vanilla-loading-native-link',
                  'binary_modified':False},f,indent=2)
          PY
      - name: Install actual Chromium, WebGL2 and WASM-GC runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' pillow
          python -m playwright install --with-deps chromium
      - name: Execute real singleplayer tests with original compiled HTML
        shell: bash
        run: |
          set -euo pipefail
          case "$TEST_KIND" in
            survival|onecpu) script=vault-acceptance/pletzel-v4-singleplayer-pressure.py ;;
            remote|remote2|remote3|remote4) script=vault-acceptance/pletzel-v4-diagnostic-remote-teleport.py ;;
            chicken) script=vault-acceptance/pletzel-v4-player-hit-arena-v3.py ;;
            vault) script=pletzel-v4-vault-mechanics-real-browser.py ;;
            lifecycle) script=vault-acceptance/pletzel-v4-lifecycle.py ;;
            schematica) script=pletzel-v4-inworld-schematica-test.py ;;
            skin-model) script=pletzel-v4/verify-steve-alex-native-browser.py ;;
            wake-loss) script=pletzel-v4/verify-lost-worker-wakeup-browser.py ;;
            *) exit 3 ;;
          esac
          xvfb-run -a -s '-screen 0 1280x720x24' python "$script" 2>&1 | tee browser-console.log
      - name: Preserve evidence of actual source-backed loading and prevent fake early 100 percent
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEST_KIND" = onecpu ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('singleplayer-pressure-evidence')
          result=json.loads((p/'result.json').read_text())
          names=set(result.get('screenshots',[]))
          assert 'spawn' in names, 'No world screenshot was taken'
          assert (p/'spawn.png').stat().st_size>10000
          # Early loading success must not fail only because the world opened before
          # a scheduled loading-screen screenshot. Never manufacture a 100% report.
          loading=[name for name in names if name.startswith('native-loading-')]
          for name in loading:
              assert (p/(name+'.png')).stat().st_size>10000
          print('Actual native loading screenshots:', sorted(loading),
                '; gameplay screenshot exists; visual review and TPS gate still required')
          PY
          fi
      - name: Aggregate real heartbeat TPS, queue, chunk stalls and exception data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python vault-acceptance/analyze-candidate-gameplay.py | tee test-analysis-console.log
      - name: Apply strict server-authoritative gameplay and stall acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEST_KIND" = skin-model ]; then
            python3 - <<'PY'
          import json
          d=json.load(open("profile-model-evidence/results.json"))
          assert len(d["screens"])==10
          assert not d["page_errors"]
          assert all(m["changed_pixels"]>=100 for m in d["model_widget_pixel_differences"].values())
          print("Real Steve/Alex GUI + multiplayer menu screenshots saved; manual review still required")
          PY
          elif [ "$TEST_KIND" = wake-loss ]; then
            python3 - <<'PY'
          import json
          d=json.load(open("wakeup-loss-evidence/result.json"))
          assert d["loss_injected"]>0 and d["supervisor_rescue_markers"]>0
          assert d["ticks_after_recovery"]>=30
          print("Dropped both wake callbacks; supervisor resumed native server ticks")
          PY
          else
            python vault-acceptance/strict-evidence-gate.py | tee strict-evidence-console.log
          fi
      - name: Keep raw screenshots and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-native-vanilla-loading-focused-${{ matrix.test }}
          retention-days: 30
          if-no-files-found: error
          path: |
            candidate-sha256.txt
            candidate-identity.json
            candidate-metrics.json
            strict-evidence-gate.json
            browser-console.log
            test-analysis-console.log
            strict-evidence-console.log
            strict-evidence-gate.json
            singleplayer-pressure-evidence/
            cheats-entity-evidence/
            lifecycle-evidence/
            inworld-schematic-evidence/
            profile-model-evidence/
            wakeup-loss-evidence/
