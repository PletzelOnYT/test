name: Pletzel V4 Root Fix - Exact Artifact In-World Verification
on:
  push:
    branches: [pletzel-v4-root-artifact-verify]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        mode: [world, schematica]
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download EXACT compiled artifact from root-fix run 42392345185
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42392345185 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-singleplayer-root-fixed-html-candidate -D candidate
          find candidate -type f -printf '%p %s bytes\n'
          test "$(find candidate -type f -name '*.html' | wc -l)" -eq 1
          file=$(find candidate -type f -name '*.html' | head -1)
          test "$(sha256sum "$file" | awk '{print $1}')" = "510c41635be41ff62ac1ebe05eb0b810ca7d6dcacfcfc0d2150c3e56378f0e5d"
          echo "VERIFIED EXACT HTML SHA256 510c41635be41ff62ac1ebe05eb0b810ca7d6dcacfcfc0d2150c3e56378f0e5d"
      - name: Install browser, WebGL2 software rasterizer and persistent IndexedDB support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' 'Pillow>=10'
          python -m playwright install --with-deps chromium
      - name: Real singleplayer NORMAL world - tick and chunk assertion
        if: matrix.mode == 'world'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-inworld-autotest.py 2>&1 | tee root-world.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('singleplayer-inworld-evidence/results.json').read_text())
          assert p['pass'], 'native normal-world tick/chunk assertions failed'
          assert p['maxTick']>200, 'insufficient tick progress'
          assert p['maxChunksSent']>3, 'chunk delivery did not advance'
          assert len(p['snapshots'])>=10, 'runtime screenshots missing'
          assert not p['fatal'],'browser fatal'
          assert all(x['indexedDB'] and x['webgl2'] for x in p['samples']), 'IndexedDB or WebGL2 unavailable'
          print('ASSERTION PASS: world loaded; server ticks',p['maxTick'],'chunks sent',p['maxChunksSent'])
          PY
      - name: Actual singleplayer Schematica file import and hologram frames
        if: matrix.mode == 'schematica'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-inworld-schematica-test.py 2>&1 | tee root-schematica.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('inworld-schematic-evidence/results.json').read_text())
          assert not p['exception'],'browser test exception'
          assert p['fileSelection']==['set classic schematic file'],'file chooser was not successful'
          assert p['heartbeatCount']>=3,'server telemetry absent'
          for n in ('07-schematic-status','11-ghost-stability-0','11-ghost-stability-1','11-ghost-stability-2','14-unload'):
            assert n in p['screens'], f'missing screenshot {n}'
          print('ASSERTION PASS: file chooser, in-world screenshot series, and unload sequence finished')
          print('CAUTION: visual ghost stability and material comparisons need independent validation')
          PY
      - name: Upload all browser evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-rootfix-${{ matrix.mode }}-evidence
          path: |
            singleplayer-inworld-evidence/
            inworld-schematic-evidence/
            root-world.log
            root-schematica.log
          retention-days: 7
          if-no-files-found: warn
