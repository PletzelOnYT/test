name: Pletzel V4 Easy Place Map Art real Chrome seven-suite acceptance
on:
  push:
    branches: [pletzel-v4-easyplace-mapart-red-20261112]
    paths:
      - '.github/workflows/pletzel-v4-easyplace-chrome-acceptance.yml'
      - 'pletzel-v4/test-easyplace-real-chrome.py'
      - 'pletzel-v4/test-persistent-mapart-chrome.py'
      - 'pletzel-v4/test-red-highlight-real-chrome.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [easyplace, mapart, red-highlight, fourformat, freecam, hologram, world-save]
    steps:
      - uses: actions/checkout@v4
      - name: Download only the exact new game-compilation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=43327048717
          sha=4d2f91e589249a3c4d199adcbd4ce5e6eb4331a6
          artifact=pletzel-v4-easyplace-easypick-mapart-red-optimized-no-voice-complete-html
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$sha"
          deadline=$(( $(date +%s) + 6900 ))
          while true; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            if [ "$state" = completed ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
              break
            fi
            test "$(date +%s)" -lt "$deadline" || exit 3
            sleep 25
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -name '*.html' | head -1)" | tee source-html-sha256.txt
      - name: Run actual Minecraft game in Chromium with WebGL and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-input 'playwright==1.56.0' Pillow
          case "${{ matrix.suite }}" in
            easyplace) script=pletzel-v4/test-easyplace-real-chrome.py;;
            mapart) script=pletzel-v4/test-persistent-mapart-chrome.py;;
            red-highlight) script=pletzel-v4/test-red-highlight-real-chrome.py;;
            fourformat) script=pletzel-v4/test-fourformat-browser-smoke.py;;
            freecam) script=pletzel-v4/test-freecam-real-flight.py;;
            hologram) script=pletzel-v4/test-native-schematic-inworld.py;;
            world-save) script=pletzel-v4/test-no-voice-world-save.py;;
            *) exit 2;;
          esac
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python3 -u "$script" 2>&1 | tee "easyplace-${{ matrix.suite }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-easyplace-${{ matrix.suite }}-real-chrome-evidence
          path: |
            source-html-sha256.txt
            easyplace-${{ matrix.suite }}.log
            red-highlight-real-chrome-evidence/
            easy-pick-real-chrome-evidence/
            map-shulker-real-inventory-evidence/
            inworld-schematic-evidence/
            freecam-real-flight-evidence/
            fourformat-browser-evidence/
            world-save-reload-evidence/
          retention-days: 30
          if-no-files-found: warn

  publish-accepted-real-html:
    needs: [chrome]
    if: ${{ needs.chrome.result == 'success' }}
    uses: ./.github/workflows/pletzel-v4-publish-easyplace-no-voice.yml
    permissions:
      contents: write
      actions: read
    with:
      build_run_id: '43327048717'
      source_sha: '4d2f91e589249a3c4d199adcbd4ce5e6eb4331a6'
      acceptance_run_id: ${{ github.run_id }}
