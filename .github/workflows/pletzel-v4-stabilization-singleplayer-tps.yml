name: Pletzel V4 stabilized HTML — real 3-minute singleplayer TPS normal and single CPU
on:
  push:
    branches: [pletzel-v4-stabilization-unified-voice-20261110]
    paths: ['.github/workflows/pletzel-v4-stabilization-singleplayer-tps.yml',
            'pletzel-v4/accept-unified-live-tps.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-ticks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [normal, singlecpu]
    env:
      CPU_MODE: ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download the exact fixed voice+mods HTML from native build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42937082477
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 091209f36bbaf93933dcf8d8ae0e4a6b8db3f1f3
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          mkdir candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-all-four-mods-complete-html -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -name '*.html' | head -1)" | tee live-tps-exact-html-sha256.txt
      - name: Install real Chromium, software WebGL, and Playwright
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' Pillow
          python -m playwright install --with-deps chromium
      - name: Actual SINGLEPLAYER world, genuine tick and frame endurance (no mocked TPS)
        shell: bash
        run: |
          set -o pipefail
          if [ "$CPU_MODE" = singlecpu ]; then
            cpu="$(python -c 'import os;print(min(os.sched_getaffinity(0)))')"
            echo "Single CPU affinity: $cpu"
            xvfb-run -a -s '-screen 0 1280x768x24' taskset -c "$cpu" python -u pletzel-v4/accept-unified-live-tps.py 2>&1 | tee live-tps-"$CPU_MODE".log
          else
            xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/accept-unified-live-tps.py 2>&1 | tee live-tps-"$CPU_MODE".log
          fi
      - name: Preserve exact binary hash, real heartbeat and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-singleplayer-tps-${{ matrix.cpu }}-exact-html-evidence
          path: |
            live-tps-exact-html-sha256.txt
            live-tps-${{ matrix.cpu }}.log
            live-tps-${{ matrix.cpu }}-evidence/
          retention-days: 21
          if-no-files-found: warn
