name: Pletzel V4 - Preserve verified compiled standalone HTML for 90 days
on:
  push:
    branches: [pletzel-v4-verified-candidate-preservation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archive-existing-binary:
    runs-on: ubuntu-24.04
    steps:
      - name: Download existing linked and packaged HTML, never compile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-game
          gh run download 42408817655 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-singleplayer-engine-tpsed-html-candidate -D original
          mapfile -t htmls < <(find original -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          cp "${htmls[0]}" verified-game/eaglercraft-26.2-Pletzel-v4-SINGLEPLAYER-FIXED.html
          printf '%s  %s\n' '1c95670852c5e1241cd78fd6646b8091ebb4aed81d5eafac32dc0761e01fc6ef' verified-game/eaglercraft-26.2-Pletzel-v4-SINGLEPLAYER-FIXED.html | sha256sum --check
          cat > verified-game/VERIFICATION.txt <<'NOTE'
          Unmodified compiled build 42408817655, source integration bf6d09ae1c72f9c7693f2daef7799028c1fa23a3
          Original artifact: pletzel-v4-singleplayer-engine-tpsed-html-candidate
          Original HTML SHA256: 1c95670852c5e1241cd78fd6646b8091ebb4aed81d5eafac32dc0761e01fc6ef
          Real browser verification run 42415800395: 4/4 jobs passed
          Normal survival mean TPS 20.3 over 185 seconds; one CPU mean TPS 15.95.
          Important: initial world loading still slow; global Chromebook performance not guaranteed.
          Check https://github.com/PletzelOnYT/test/issues/1 for full evidence/caveats.
          NOTE
      - uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-verified-standalone-html-90day
          path: verified-game/
          retention-days: 90
          if-no-files-found: error
