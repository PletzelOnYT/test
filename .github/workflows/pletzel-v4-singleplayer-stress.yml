name: Pletzel V4 Stress - Independent Normal Worlds
on:
  push:
    branches: [pletzel-v4-singleplayer-stress]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  random-world:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch playable original V4 WASM with fixed audio and inline assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42388583490 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-real-audio-runtime-candidate -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
      - name: Install Chromium graphics and IndexedDB-capable environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test random world ${{ matrix.trial }} - assert server ticks and chunk delivery
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-inworld-autotest.py 2>&1 | tee "stress-${{ matrix.trial }}.log"
      - name: Preserve each world's test and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-stress-world-${{ matrix.trial }}
          path: |
            singleplayer-inworld-evidence/
            stress-${{ matrix.trial }}.log
          retention-days: 7
          if-no-files-found: warn
