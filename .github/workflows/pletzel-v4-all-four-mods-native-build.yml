            ('FEATURES',2213376),('INITIALIZE_LIGHT',13421772),('LIGHT',16769184),
            ('SPAWN',15884384),('FULL',16777215)]
          actual=[(a,int(b)) for a,b in re.findall(r'map.put\(ChunkStatus\.(\w+), (\d+)\)',src)]
          assert actual==expected,(actual,expected)
          statuses=re.findall(r'public static final ChunkStatus (\w+) = register\(',sta)
          assert statuses==[x[0] for x in expected], statuses
          assert 'extractChunksForRendering(graphics, xCenter, yCenter, 2, 0, statusView)' in src
          assert 'this.extractPanorama(graphics, a)' in src
