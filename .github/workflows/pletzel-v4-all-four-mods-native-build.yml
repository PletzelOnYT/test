name: Pletzel V4 stabilization — four-mod native Minecraft 26.2 with WebRTC audio repair
on:
  push:
    branches: [pletzel-v4-stabilization-unified-voice-20261110]
    paths:
      - '.github/workflows/pletzel-v4-all-four-mods-native-build.yml'
      - 'pletzel-v4/eaglerx-voice/PlatformEaglerVoice26.java'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EAGLER_BUILD_CAP_MIB: '13312'
      EAGLER_LINK_HEAP_MIB: '12288'
      CANDIDATE: Pletzel-V4-ALL-MODS-COMPLETE.html
    steps:
      - name: Checkout isolated integration kit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for existing original GUI link to complete BEFORE starting corrected native compilation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_run=42761495178
          base_sha=198066292dceeffdf73d6713b273c423e242badf
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$base_run" --jq .head_sha)" = "$base_sha"
          deadline=$(( $(date +%s) + 6300 ))
          while true; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$base_run" --jq .status)"
            echo "Existing native Wasm linker run $base_run: $status"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$base_run" --jq .conclusion)"
              echo "Existing original GUI binary result: $conclusion"
              test "$conclusion" = success || { echo "STOP: inspect failure before another expensive build"; exit 3; }
              break
            fi
            test "$(date +%s)" -lt "$deadline" || exit 4
            sleep 30
          done
      - name: Checkout pinned public 26.2 source
        uses: actions/checkout@v4
        with:
          repository: dicestack88/Eaglercraft-26.2-source
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: engine
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record runtime resources and source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          { java -version; node --version; free -h; df -h .; git -C engine rev-parse HEAD; cat engine/gradle/wrapper/gradle-wrapper.properties; } 2>&1 | tee logs/environment.log
          test "$(git -C engine rev-parse HEAD)" = "f73bff91f0f0840bc958c09ab536dbba1e146b2e"
          mem=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          disk=$(df -Pm . | awk 'NR==2 {print $4}')
          if (( mem < 14500 || disk < 10000 )); then
            echo "INSUFFICIENT_RESOURCES: RAM=${mem}MiB DISK=${disk}MiB" | tee logs/preflight-failure.log
            exit 3
          fi
      - name: Verify and extract the existing Pletzel V4 Java source archive
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const payload = Buffer.from(fs.readFileSync('pletzel-v4/native-patches.tar.br.b64', 'utf8').trim(), 'base64');
          const hash = crypto.createHash('sha256').update(payload).digest('hex');
          const expected = 'bc622e01aafba87d52b50556972e3819a8ae58fad3273818aca7e3c3ddc84af5';
          if (hash !== expected) throw new Error('Patch archive sha256 mismatch: '+hash);
          fs.writeFileSync('pletzel-v4/native-patches.tar',zlib.brotliDecompressSync(payload));
          console.log('Verified pre-existing native patch archive:',payload.length,'B, sha256',hash);
          JS
          tar -tf pletzel-v4/native-patches.tar | tee logs/native-source-list.txt
          tar -xf pletzel-v4/native-patches.tar -C pletzel-v4/
      - name: Dry-run and apply original native renderer/menu patch
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/apply_to_26_2_source.py engine --dry-run 2>&1 | tee logs/patch-dry-run.log
          python3 pletzel-v4/apply_to_26_2_source.py engine 2>&1 | tee logs/patch-apply.log
          grep -F 'SchematicaWorldRenderer.submit(' engine/game/src/main/java/net/minecraft/client/renderer/LevelRenderer.java
          grep -F 'Optimized by Pletzel' engine/game/src/main/java/net/minecraft/client/gui/screens/TitleScreen.java
      - name: Fix verified 26.2 colored block API difference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/game/src/main/java/net/pletzel/schematica/SchematicaSession.java')
          src=p.read_text()
          before='Blocks.WHITE_WOOL.defaultBlockState()'
          after='Blocks.WOOL.white().defaultBlockState()'
          assert src.count(before)==1, 'unexpected Java mapping source; refuse edit'
          src=src.replace(before,after,1)
          p.write_text(src)
          print('FIXED: Minecraft 26.2 ColorCollection<Block> WOOL.white()')
          PY
      - name: Apply native Schematica GUI and file-picker source fixes
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),zlib=require('node:zlib');
          const b=Buffer.from(fs.readFileSync('pletzel-v4/gui-hotfix.py.br.b64','utf8').trim(),'base64');
          const hash=crypto.createHash('sha256').update(b).digest('hex');
          if(hash!=='690542eb0f12742026a08ca4815a210dc67a371c241014c4691f636ea53374b4')
            throw new Error('GUI hotfix source archive SHA mismatch: '+hash);
          fs.writeFileSync('pletzel-v4/gui-hotfix.py',zlib.brotliDecompressSync(b));
          console.log('Verified GUI and file-chooser hotfix payload',hash);
          JS
          python3 pletzel-v4/gui-hotfix.py engine 2>&1 | tee logs/gui-hotfix.log
          grep -F 'Dedicated top-of-screen status' engine/game/src/main/java/net/pletzel/schematica/SchematicaScreen.java
          grep -F 'File selection cancelled' engine/game/src/main/java/net/pletzel/schematica/SchematicaScreen.java
          grep -F 'fileChooserElement == inputElement' engine/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/internal/PlatformApplication.java
      - name: Apply depth-stable hologram and live-world comparison patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64
          p=Path('pletzel-v4/engine-render-repair.py.gz.b64')
          Path('pletzel-v4/engine-render-repair.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          PY
          python3 pletzel-v4/engine-render-repair.py engine 2>&1 | tee logs/render-repair.log
          grep -F 'pletzelHologram' engine/game/src/main/java/net/pletzel/schematica/SchematicaWorldRenderer.java
          grep -F 'actual.equals(cell.expected)' engine/game/src/main/java/net/pletzel/schematica/SchematicaWorldRenderer.java
      - name: Restore real vanilla colored worldgen chunk grid from server IPC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64
          p=Path('pletzel-v4/real-chunk-grid.py.gz.b64')
          data=base64.b64decode(p.read_text().strip())
          Path('pletzel-v4/real-chunk-grid.py').write_bytes(gzip.decompress(data))
          PY
          python3 pletzel-v4/real-chunk-grid.py engine 2>&1 | tee logs/real-chunk-grid.log
          grep -Fq 'IPCPacket23ChunkStatusGrid' engine/platform/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/ipc/IPCPacketManager.java
      - name: Show native 26.2 worldgen bar with REAL server IPC stage fraction
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-native-loading-progress-ipc.py engine 2>&1 | tee logs/native-loading-ipc-progress.log
          grep -Fq 'actualServerProgress' engine/game/src/main/java/net/minecraft/client/multiplayer/LevelLoadTracker.java
          git -C engine diff --check
      - name: Fix WasmGC server worker selection mismatch with world metadata initialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/internal/ClientPlatformSingleplayer.java')
          src=p.read_text()
          old='return isServerWorkerFlagJS() && workerSupportedJS();'
          new='return workerSupportedJS() && (net.lax1dude.eaglercraft.v1_8.internal.teavm.WasmWorkerBootstrap.isWasmGC() || isServerWorkerFlagJS());'
          assert src.count(old)==1, 'worker metadata preflight semantics unexpectedly changed'
          p.write_text(src.replace(old,new,1))
          print('Fixed serverWorkerModeRequested to match actual WasmGC dedicated-worker selection')
          PY
          grep -F 'WasmWorkerBootstrap.isWasmGC() || isServerWorkerFlagJS()' engine/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/internal/ClientPlatformSingleplayer.java
      - name: Fix confirmed TeaVM inline worldgen/biome executor scheduling defect
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-worldgen-async.py engine 2>&1 | tee logs/worldgen-async-repair.log
          grep -Fq 'EaglerWorldgenExecutor.INSTANCE' engine/game/src/main/java/net/minecraft/world/level/levelgen/NoiseBasedChunkGenerator.java
          grep -Fq 'EaglerWorldgenExecutor.INSTANCE' engine/game/src/main/java/net/minecraft/world/level/chunk/ChunkGenerator.java
          git -C engine diff --check
      - name: Isolate web worldgen and live-tick coroutine checkpoint deadlines
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-worldgen-fair-slices.py engine 2>&1 | tee logs/fair-slices-repair.log
          grep -Fq 'worldgenNextYieldAt' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/EaglerWorldgenYield.java
          grep -Fq 'serverNextYieldAt' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/EaglerWorldgenYield.java
          git -C engine diff --check
      - name: Honor real chunk-decode ACKs and bound stale client packet backlog
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-singleplayer-stream-backpressure.py engine 2>&1 | tee logs/singleplayer-stream-backpressure.log
          grep -Fq 'WEB_MIN_CHUNKS_PER_TICK = 0.25F' engine/game/src/main/java/net/minecraft/server/network/PlayerChunkSender.java
          grep -Fq 'EMERGENCY_BACKLOG_BUDGET_MILLIS = 32.0' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/SingleplayerInboundPumpPolicy.java
          git -C engine diff --check
      - name: Defer browser trial spawner tick instead of synchronous neighbor FULL-chunk wait
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-trial-spawner-full-chunk-guard.py engine 2>&1 | tee logs/trial-spawner-guard.log
          grep -Fq 'getChunkNow(cx, cz) == null' engine/game/src/main/java/net/minecraft/world/level/block/entity/trialspawner/TrialSpawner.java
          git -C engine diff --check
      - name: Defer only browser villager Brain AI when nearby FULL chunks unavailable
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-villager-ai-nonblocking.py engine 2>&1 | tee logs/villager-ai-nonblocking.log
          grep -Fq 'level.getChunkSource().getChunkNow(cx, cz) == null' engine/game/src/main/java/net/minecraft/world/entity/npc/villager/Villager.java
          git -C engine diff --check
      - name: Guard browser vault against neighboring FULL chunk blocking waits
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-vault-full-neighbor-guard.py engine 2>&1 | tee logs/vault-neighbor-guard.log
          grep -Fq 'serverLevel.getChunkSource().getChunkNow(cx, cz) == null' engine/game/src/main/java/net/minecraft/world/level/block/entity/vault/VaultBlockEntity.java
          git -C engine diff --check
      - name: Guarantee TeaVM integrated-server tick resume when scheduler.postTask silently stalls
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-hosted-server-tick-wakeup.py engine 2>&1 | tee logs/server-tick-wakeup-liveness.log
          grep -Fq 'var fallback = globalThis.setTimeout(wake, d + 100);' engine/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/internal/ServerPlatformSingleplayer.java
          git -C engine diff --check
      - name: Rescue REAL suspended TeaVM server callbacks from active worker supervisor
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-supervisor-tick-resume.py engine | tee logs/supervisor-tick-wake-repair.log
          node pletzel-v4/test-supervisor-wake-once.cjs engine/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/internal/ServerPlatformSingleplayer.java | tee logs/supervisor-wake-native-js-test.log
          grep -Fq 'ServerPlatformSingleplayer.recoverOverdueServerTick();' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/EaglerIntegratedServerWorker26.java
          git -C engine diff --check
      - name: Restore native Steve and Alex classic/slim arm choice for ALL skins
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/restore-steve-alex-profile-choice.py engine | tee logs/steve-alex-model-restoration.log
          grep -Fq 'modelButton.visible = true;' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/profile/EaglerProfileScreen26.java
          grep -Fq 'pairedBase' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/profile/EaglerProfileScreen26.java
          git -C engine diff --check
      - name: Repair relay movement flush, original chunk geometry invalidation and Schematica depth
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-movement-terrain-ghost.py engine 2>&1 | tee logs/movement-terrain-ghost-repair.log
          grep -Fq 'this.connection.setEaglerTransport(this::pump, this::close, this::drainOutbound);' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/socket/WebSocketPacketBridge.java
          grep -Fq 'faceSeparation = missing ? 1.002f : 1.006f' engine/game/src/main/java/net/pletzel/schematica/SchematicaWorldRenderer.java
          git -C engine diff --check
      - name: Instrument ACTUAL blocked FULL chunk wait in real Mac Chrome under perfdebug
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/trace-active-blocked-chunk-wait.py engine 2>&1 | tee logs/active-chunk-wait-trace.log
          grep -Fq '[PletzelActiveChunkWait]' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/EaglerServerPerf.java
          git -C engine diff --check
      - name: Repair observed Mac 4045ms STRUCTURE_STARTS player advancement sync stall
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-player-structure-starts-nonblocking.py engine 2>&1 | tee logs/player-structure-starts-no-wait.log
          grep -F 'eaglerStructureStartsAvailableWithoutBlocking' engine/game/src/main/java/net/minecraft/advancements/predicates/LocationPredicate.java
          git -C engine diff --check
      - name: Identify whether Mac 8.11-second presentation pause is submit, surface or cleanup (opt-in)
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/trace-client-present-stall.py engine 2>&1 | tee logs/mac-client-present-subphases.log
          grep -F '[PletzelPresentStall]' engine/game/src/main/java/net/minecraft/client/Minecraft.java
          git -C engine diff --check
      - name: Restore native 26.2 vanilla loading throughout server startup and expose real stage grid
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/repair-vanilla-loading-startup.py engine 2>&1 | tee logs/vanilla-loading-startup.log
          grep -Fq 'this.gui.setScreen(screen);' engine/game/src/main/java/net/minecraft/client/Minecraft.java
          ! grep -Fq 'eaglerBusyScreen = new' engine/game/src/main/java/net/minecraft/client/Minecraft.java
          grep -Fq 'currentFocusChunk()' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/EaglerIntegratedServerWorker26.java
          grep -Fq 'ChunkLevel.RADIUS_AROUND_FULL_CHUNK + 1' engine/game/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/server/EaglerIntegratedServerWorker26.java
          grep -Fq 'spawn.validatedFullChunk' engine/game/src/main/java/net/minecraft/server/MinecraftServer.java
          grep -Fq 'eaglerStructureStartsAvailableWithoutBlocking' engine/game/src/main/java/net/minecraft/advancements/predicates/LocationPredicate.java
          grep -Fq 'fillToCurrentLayer' engine/game/src/main/java/net/minecraft/client/gui/screens/LevelLoadingScreen.java
          git -C engine diff --check
      - name: Defer browser initial spawn until genuine FULL chunks are ready and validate before server ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          encoded=Path('pletzel-v4/repair-browser-initial-spawn.py.gz.b64').read_text().strip()
          script=gzip.decompress(base64.b64decode(encoded,validate=True))
          expected='de09dcad69b44525a516e77d46949a97786340ec64225ac1f270b1c618baaa03'
          assert hashlib.sha256(script).hexdigest()==expected, 'spawn patch changed unexpectedly'
          Path('pletzel-v4/repair-browser-initial-spawn.py').write_bytes(script)
          print('PINNED browser spawn patch SHA-256',expected)
          PY
          python3 -m py_compile pletzel-v4/repair-browser-initial-spawn.py
          python3 pletzel-v4/repair-browser-initial-spawn.py engine 2>&1 | tee logs/safe-async-browser-spawn.log
          grep -Fq 'eaglerFinishBrowserInitialSpawn' engine/game/src/main/java/net/minecraft/server/MinecraftServer.java
          grep -Fq 'spawn.validatedAfterFull' engine/game/src/main/java/net/minecraft/server/MinecraftServer.java
          grep -Fq 'ready.join(); // only an already-completed future' engine/game/src/main/java/net/minecraft/server/MinecraftServer.java
          git -C engine diff --check
      - name: Add native Singleplayer warning GUI AFTER all engine patches
        shell: bash
        run: |
          set -euo pipefail
          python3 pletzel-v4/patch-singleplayer-warning.py engine | tee logs/singleplayer-warning-source.log
          grep -Fq 'new PletzelSingleplayerWarningScreen(this)' engine/game/src/main/java/net/minecraft/client/gui/screens/TitleScreen.java
          grep -Fq 'public void openSingleplayerAfterWarning()' engine/game/src/main/java/net/minecraft/client/gui/screens/TitleScreen.java
          grep -Fq 'extends Screen' engine/game/src/main/java/net/minecraft/client/gui/screens/PletzelSingleplayerWarningScreen.java
          grep -Fq 'this.setInitialFocus(this.continueButton);' engine/game/src/main/java/net/minecraft/client/gui/screens/PletzelSingleplayerWarningScreen.java
          git -C engine diff --check
      - name: Fix REAL hybrid touch and mouse device switching in Java + TeaVM
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pletzel-v4/patch-active-input-mode.py
          python3 pletzel-v4/patch-active-input-mode.py engine 2>&1 | tee logs/touch-mouse-mode-patch.log
          grep -Fq 'new PletzelSingleplayerWarningScreen(this)' engine/game/src/main/java/net/minecraft/client/gui/screens/TitleScreen.java
          grep -Fq 'isTouchGeneratedMouse(evt)' engine/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/internal/PlatformInput.java
          grep -Fq 'options.pletzelInputMode.0' engine/game/src/main/resources/assets/minecraft/lang/en_us.json
          grep -Fq 'options.pletzelInputMode()' engine/game/src/main/java/net/minecraft/client/gui/screens/options/controls/ControlsScreen.java
          git -C engine diff --check
      - name: Apply faithful native Map Tooltip 5.0.1 port after Singleplayer warning and touch controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pletzel-v4/patch-map-tooltip-native.py pletzel-v4/test-map-tooltip-native-source.py
          python3 pletzel-v4/patch-map-tooltip-native.py engine | tee logs/native-map-tooltip-source.log
          python3 pletzel-v4/test-map-tooltip-native-source.py engine | tee logs/native-map-tooltip-source-test.log
          grep -Fq 'MapTooltipData' engine/game/src/main/java/net/minecraft/world/item/MapItem.java
          grep -Fq 'MapTooltipClientComponent' engine/game/src/main/java/net/minecraft/client/gui/screens/inventory/tooltip/ClientTooltipComponent.java
          git -C engine diff --check
      - name: Port native 27-slot Shulker Tooltip and persist ON/OFF settings for both tooltips
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pletzel-v4/patch-shulker-tooltips-native.py pletzel-v4/test-both-native-tooltips-source.py
          python3 pletzel-v4/patch-shulker-tooltips-native.py engine 2>&1 | tee logs/native-shulker-tooltip-source.log
          python3 pletzel-v4/test-both-native-tooltips-source.py engine 2>&1 | tee logs/both-tooltips-source-check.log
          git -C engine diff --check
      - name: Checkout exact original Shulker Box Tooltip 5.4.3 + Minecraft 26.2 sprite source
        uses: actions/checkout@v4
        with:
          repository: MisterPeModder/ShulkerBoxTooltip
          ref: v5.4.3+26.2
          path: shulker-mod-reference
          persist-credentials: false
      - name: Port original Shulker Box Tooltip full GUI (NO SETTINGS CHANGES)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pletzel-v4/patch-exact-shulker-gui.py pletzel-v4/test-exact-shulker-gui-source.py
          python3 pletzel-v4/test-shulker-geometry-upstream.py | tee logs/shulker-original-geometry-upstream.log
          python3 -m py_compile pletzel-v4/test-original-shulker-gui-ctrl-lock.py
          dest=engine/game/src/main/resources/assets/shulkerboxtooltip/textures/gui/sprites
          orig=shulker-mod-reference/common/src/main/resources/assets/shulkerboxtooltip/textures/gui/sprites
          mkdir -p "$dest"
          cp "$orig/shulker_box_tooltip.png" "$dest/shulker_box_tooltip.png"
          cp "$orig/shulker_box_tooltip.png.mcmeta" "$dest/shulker_box_tooltip.png.mcmeta"
          echo '25c53d6d239aa0ed24fec7a5dc7eacea32060ea4acac9ca9f6ea1a7ae8570281  engine/game/src/main/resources/assets/shulkerboxtooltip/textures/gui/sprites/shulker_box_tooltip.png' | sha256sum -c -
          python3 pletzel-v4/patch-exact-shulker-gui.py engine 2>&1 | tee logs/original-shulker-gui-source.log
          python3 pletzel-v4/test-exact-shulker-gui-source.py engine 2>&1 | tee logs/original-shulker-gui-parity.log
          grep -Fq 'pletzelShulkerLockedPreviewSlot' engine/game/src/main/java/net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.java
          grep -Fq 'final int dx=mouseX-x+1-OFFSET;' engine/game/src/main/java/net/pletzel/shulkertooltip/ShulkerTooltipClientComponent.java
          grep -Fq 'HEIGHT+4' engine/game/src/main/java/net/pletzel/shulkertooltip/ShulkerTooltipClientComponent.java
          git -C engine diff --check
      - name: Port OFFICIAL EaglerXServer V5 voice onto same native Minecraft source (NO PLETZEL GATEWAY)
        shell: bash
