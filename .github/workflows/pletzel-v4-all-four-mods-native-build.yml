      - name: Bundle the original MIT author attribution in the standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import html
          map_notice=Path('pletzel-v4/MAP-TOOLTIP-THIRD-PARTY-NOTICE.md').read_text()
          shulker_notice=Path('pletzel-v4/SHULKER-TOOLTIP-THIRD-PARTY-NOTICE.md').read_text()
          assert 'Copyright (c) VendoAU' in map_notice and 'MIT License' in map_notice
          assert 'MisterPeModder' in shulker_notice and 'MIT License' in shulker_notice
          notice=map_notice+'\\n'+shulker_notice
          target=Path('engine')/'''${{ env.CANDIDATE }}'''
          assert target.exists() and target.stat().st_size>85000000
          # An HTML comment ensures that the published binary carries attribution
          # without changing the game canvas, WASM or startup scripts.
          payload=notice.replace('--','- -')
          with target.open('a',encoding='utf-8') as o:
              o.write('\n<!--\n'+payload+'\n-->\n')
          tail=target.read_text(errors='replace')[-8000:]
          assert 'Copyright (c) VendoAU' in tail and 'MisterPeModder' in tail
          PY
      - name: Validate compiled WebAssembly and record candidate
        shell: bash
        run: |
          set -euo pipefail
          wasm=engine/target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm
          test -s "$wasm"
          node - "$wasm" <<'JS' | tee logs/wasm-validation.log
          const fs = require('node:fs'),crypto=require('node:crypto');
          const bytes=fs.readFileSync(process.argv[2]);
          const mod=new WebAssembly.Module(bytes);
          console.log('VALID WASM',bytes.length,'sha256',crypto.createHash('sha256').update(bytes).digest('hex'));
          console.log('imports',WebAssembly.Module.imports(mod).length,'exports',WebAssembly.Module.exports(mod).length);
          console.log('WARNING: macOS structure-starts candidate still requires actual saved-world, graphical and multiplayer validation');
          JS
          cp "$wasm" engine/Pletzel-v4-compiled.wasm
          test -s "engine/$CANDIDATE"
          sha256sum "$wasm" "engine/$CANDIDATE" | tee logs/artifact-sha256.txt
