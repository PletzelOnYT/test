name: Pletzel V4 final touch auto and saved override browser proof (NO REBUILD)
on:
  push:
    branches: [pletzel-v4-touch-final-acceptance]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Await exact final native V4 HTML without building
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=42725566532
          expected_sha=9cc42007fdd04157e5a5aa11be8b2c56aed3a3a0
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$expected_sha"
          deadline=$(( $(date +%s) + 5500 ))
          while :; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            echo "Final native build $run: $state"
            if [ "$state" = completed ]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
              test "$conclusion" = success || { echo "Native final build failed: $conclusion"; exit 3; }
              break
            fi
            test "$(date +%s)" -lt "$deadline" || exit 4
            sleep 25
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-touch-mouse-final-complete-html -D candidate
          test "$(find candidate -type f -name '*.html' | wc -l)" -eq 1
          find candidate -type f -name '*.html' -exec sha256sum {} \;
          test "$(find candidate -type f -name '*.html' -exec stat -c %s {} \;)" -gt 85000000
      - name: Install actual Chromium/WebGL2/Wasm-GC runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' pillow
          python -m playwright install --with-deps chromium
      - name: Verify four actual touch-and-mouse switching cycles with native toolbar pixels
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python pletzel-v4/test-touch-mouse-real-browser.py 2>&1 | tee final-touch-mouse-browser.log
      - name: Verify native Controls override, keyboard stability and reload persistence
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python pletzel-v4/test-touch-mouse-final-acceptance.py 2>&1 | tee final-controls-override.log
      - name: Preserve actual browser screenshot, console errors and settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-touch-mouse-final-real-browser-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            touch-mouse-evidence/
            input-mode-override-evidence/
            final-touch-mouse-browser.log
            final-controls-override.log
