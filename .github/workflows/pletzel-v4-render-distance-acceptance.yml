name: Pletzel V4 Easy Place actual render distance 2 4 8 16 chunk acceptance
on:
  push:
    branches: [pletzel-v4-easyplace-mapart-red-20261112]
    paths:
      - '.github/workflows/pletzel-v4-render-distance-acceptance.yml'
      - 'pletzel-v4/test-render-distance-inworld.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  distance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact optimized WebAssembly game
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=43330230377
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 41f169b6cf64f0d88e8ce92e36f7b32fce3e6cab
          deadline=$(( $(date +%s) + 6900 ))
          while true; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            if [ "$state" = completed ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
              break
            fi
            test "$(date +%s)" -lt "$deadline" || exit 3
            sleep 25
          done
          mkdir candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-easyplace-easypick-mapart-red-optimized-no-voice-complete-html -D candidate
          test "$(find candidate -iname '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -iname '*.html' | head -1)" | tee exact-html-sha256.txt
      - name: Change native Minecraft video settings 2 4 8 16 and compare live hologram sections
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --no-input 'playwright==1.56.0' Pillow
          xvfb-run -a -s '-screen 0 1280x768x24' python3 -u pletzel-v4/test-render-distance-inworld.py 2>&1 | tee render-distance-acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-render-distance-real-chrome-acceptance
          path: |
            exact-html-sha256.txt
            render-distance-acceptance.log
            render-distance-inworld-evidence/
          retention-days: 30
