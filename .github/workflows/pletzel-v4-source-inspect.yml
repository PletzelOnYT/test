name: Pletzel V4 Source Snapshot for Singleplayer Repair
on:
  push:
    branches: [pletzel-v4-singleplayer-repair]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dicestack88/Eaglercraft-26.2-source
          ref: f73bff91f0f0840bc958c09ab536dbba1e146b2e
          path: engine
          persist-credentials: false
      - name: Apply V4 native patches and GUI picker fixes to inspect exact code
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs'),zlib=require('zlib');
          for (const [from,to] of [['pletzel-v4/native-patches.tar.br.b64','pletzel-v4/native-patches.tar'],['pletzel-v4/gui-hotfix.py.br.b64','pletzel-v4/gui-hotfix.py']]) {
            fs.writeFileSync(to,zlib.brotliDecompressSync(Buffer.from(fs.readFileSync(from,'utf8').trim(),'base64')));
          }
          JS
          tar -xf pletzel-v4/native-patches.tar -C pletzel-v4
          python3 pletzel-v4/apply_to_26_2_source.py engine
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/game/src/main/java/net/pletzel/schematica/SchematicaSession.java')
          src=p.read_text();assert src.count('Blocks.WHITE_WOOL.defaultBlockState()')==1
          p.write_text(src.replace('Blocks.WHITE_WOOL.defaultBlockState()','Blocks.WOOL.white().defaultBlockState()',1))
          PY
          python3 pletzel-v4/gui-hotfix.py engine
      - name: Package V4 source and original build scripts for offline analysis
        run: |
          set -euo pipefail
          tar -czf pletzel-v4-source-snapshot.tar.gz \
            engine/game/src/main/java \
            engine/platform/src \
            engine/platform-teavm/src \
            engine/teavm-compat/src \
            engine/target_teavm_wasm_gc/src \
            engine/target_teavm_wasm_gc_server/src \
            engine/target_teavm_wasm_gc_mesh/src \
            engine/wasm-toolchain \
            engine/build.gradle.kts \
            engine/game/build.gradle.kts \
            pletzel-v4 \
            --exclude='*/build' --exclude='*.jar' --exclude='*.wasm'
          ls -lh pletzel-v4-source-snapshot.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-patched-source-snapshot
          path: pletzel-v4-source-snapshot.tar.gz
          retention-days: 3
