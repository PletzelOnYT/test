name: Pletzel V4 repaired Litematica actual in-world hologram Chrome smoke
on:
  push:
    branches: [pletzel-v4-freecam-direction-settings-isolated-20261111]
    paths:
      - '.github/workflows/pletzel-v4-schematic-inworld-final.yml'
      - 'pletzel-v4/test-native-schematic-inworld.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inworld:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact rebuilt no-voice Freecam plus Litematica standalone HTML
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=43150652898
          expected_sha=3861f72a3c50311d349e512f767eb6251d521152
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$expected_sha"
          deadline=$(( $(date +%s) + 6900 ))
          while true; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            if [ "$status" = completed ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
              break
            fi
            test "$(date +%s)" -lt "$deadline" || exit 3
            sleep 25
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-corrected-shulker-gui-complete-html -D candidate
          test "$(find candidate -iname '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -iname '*.html' | head -1)" | tee exact-html-sha256.txt
      - name: Native file import, gameplay and hologram persistence screenshots
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --no-input 'playwright==1.56.0' Pillow
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/test-native-schematic-inworld.py 2>&1 | tee inworld-schematic.log
      - name: Record evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-repaired-litematica-inworld-evidence
          path: |
            exact-html-sha256.txt
            inworld-schematic.log
            inworld-schematic-evidence/
          retention-days: 30
          if-no-files-found: warn
