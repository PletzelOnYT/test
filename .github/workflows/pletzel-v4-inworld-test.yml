name: Pletzel V4 TRUE Singleplayer Worldgen Regression
on:
  push:
    branches: [pletzel-v4-singleplayer-repair]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  singleplayer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch reassembled game with validated 26.2 sounds and permanent XHR bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42388583490 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-real-audio-runtime-candidate -D candidate
          find candidate -type f -ls
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Auto-create NORMAL singleplayer world and assert live ticks and chunk delivery
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-inworld-autotest.py 2>&1 | tee inworld-autotest.log
      - name: Upload full evidence even when assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-real-singleplayer-worldgen-evidence
          path: |
            singleplayer-inworld-evidence/
            inworld-autotest.log
          retention-days: 7
          if-no-files-found: warn
