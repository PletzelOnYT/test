name: Pletzel V4 exact repaired HTML — real save quit reload block persistence
on:
  push:
    branches: [pletzel-v4-stabilization-unified-voice-20261110]
    paths: ['.github/workflows/pletzel-v4-stabilization-world-save.yml',
            'pletzel-v4/accept-unified-world-save-reload.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  server-authoritative-save-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch exact committed game output not the source checkout's HTML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42966539320
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 33b38b3a24e1751e2ca5b4cc02426c5639964ec4
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-all-four-mods-complete-html -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -name '*.html' | head -1)" | tee saved-world-exact-html-sha256.txt
      - name: Install real browser and graphics
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' Pillow
          python -m playwright install --with-deps chromium
      - name: REAL server — create, place block, save, exit, reopen, query saved block
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/accept-unified-world-save-reload.py 2>&1 | tee saved-world-real-browser.log
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-exact-html-real-world-save-reopen-evidence
          path: |
            saved-world-real-browser.log
            saved-world-exact-html-sha256.txt
            world-save-reload-evidence/
          retention-days: 21
          if-no-files-found: warn
