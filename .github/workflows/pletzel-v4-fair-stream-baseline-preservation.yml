name: Pletzel V4 - Preserve exact fair and stream baselines for 90 days
on:
  push:
    branches: [pletzel-v4-fair-stream-baselines-preserved]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve-immutable-binaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and checksum EXACT two previously compiled standalone files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archive/fair archive/stream
          gh run download 42420884116 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-fair-slices-html-candidate -D fair-original
          gh run download 42421588633 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-stream-backpressure-html-candidate -D stream-original
          mapfile -t f < <(find fair-original -name '*.html')
          mapfile -t s < <(find stream-original -name '*.html')
          test "${#f[@]}" -eq 1 && test "${#s[@]}" -eq 1
          cp "${f[0]}" archive/fair/eaglercraft-26.2-Pletzel-v4-FAIR-SLICES-UNVERIFIED.html
          cp "${s[0]}" archive/stream/eaglercraft-26.2-Pletzel-v4-STREAM-BACKPRESSURE-UNVERIFIED.html
          printf '%s  %s\n' '32ac8e26581ac373f1b5f9f9e5e25a7eb59752a829f011a968c32cf7b3f7fa6f' archive/fair/*.html | sha256sum -c -
          printf '%s  %s\n' '2c7de33e3b455b6c2bbca67f67963bf13cd81c04a468aa2de242ec12f8003b4d' archive/stream/*.html | sha256sum -c -
          sha256sum archive/*/*.html | tee archive/verified-digests.txt
          cat > archive/NOTICE.txt <<'TEXT'
          These are byte-identical original compiled HTML artifacts, NOT final fixed releases.
          Fair scheduling build 42420884116 commit 3172fdefbee419b5af00869dc1ff3318722788c1.
          Stream backpressure build 42421588633 commit 938dbf18e6be53c4b84d27c26be5d6e69d3f2b8f.
          Both used pinned dicestack88 upstream f73bff91f0f0840bc958c09ab536dbba1e146b2e.
          Six real browser verification jobs: 42427136565.
          Fair build observed ~5.73-second trial spawner synchronous chunk wait.
          Stream build observed ~17.37-second trial spawner and 6.258-second villager synchronous chunk waits.
          NO CLAIM of fully functional singleplayer or mouse hit knockback.
          Root-cause checkpoints: https://github.com/PletzelOnYT/test/issues/1
          TEXT
      - uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-fair-stream-immutable-baselines-90d
          path: archive/
          retention-days: 90
          if-no-files-found: error
