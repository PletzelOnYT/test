name: Pletzel V4 no-voice actual singleplayer TPS and world-save regression
on:
  push:
    branches: [pletzel-v4-litematica-freecam-no-voice-20261111]
    paths:
      - '.github/workflows/pletzel-v4-no-voice-singleplayer-acceptance.yml'
      - 'pletzel-v4/test-no-voice-live-tps.py'
      - 'pletzel-v4/test-no-voice-world-save.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-singleplayer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact compiled standalone no-voice HTML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=43148244757
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = fda42ecd4cf6906de6ab7ddc04a57ed87bcf9f51
          deadline=$(( $(date +%s) + 6900 ))
          while true; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            if [ "$status" = completed ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
              break
            fi
            test "$(date +%s)" -lt "$deadline"
            sleep 25
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-corrected-shulker-gui-complete-html -D candidate
          test "$(find candidate -iname '*.html' | wc -l)" -eq 1
          sha256sum "$(find candidate -iname '*.html' | head -1)" | tee exact-html-sha256.txt
      - name: Install real Chromium WebGL2 browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install --no-input 'playwright==1.56.0' Pillow
      - name: Real 3-minute singleplayer engine TPS and render endurance
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/test-no-voice-live-tps.py 2>&1 | tee live-tps-no-voice.log
      - name: Real integrated-server saved block persists after world quit and reopen
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python -u pletzel-v4/test-no-voice-world-save.py 2>&1 | tee saved-world-no-voice.log
      - name: Upload actual gameplay evidence even if any test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-no-voice-singleplayer-live-tps-and-save-acceptance
          path: |
            exact-html-sha256.txt
            live-tps-no-voice.log
            saved-world-no-voice.log
            live-tps-normal-evidence/
            world-save-reload-evidence/
          retention-days: 30
          if-no-files-found: warn
