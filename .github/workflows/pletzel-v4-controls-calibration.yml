name: Pletzel V4 native Options Controls UI coordinate calibration (NO BUILD)
on:
  push:
    branches: [pletzel-v4-controls-ui-calibration]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover previous proven native warning HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download 42563157184 -R "$GITHUB_REPOSITORY" -n pletzel-v4-singleplayer-warning-complete-html -D candidate
      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' pillow
          python -m playwright install --with-deps chromium
      - name: Navigate native Options and Controls in actual WebGL game
        run: xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4/calibrate-controls-native.py
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-controls-ui-calibration
          path: controls-ui-calibration/
          retention-days: 7
          if-no-files-found: warn
