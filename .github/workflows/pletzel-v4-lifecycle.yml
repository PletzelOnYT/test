name: Pletzel V4 World Movement Save and Reopen
on:
  push:
    branches: [pletzel-v4-singleplayer-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  move-save-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch previously tested compiled V4 with genuine EPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42388583490 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-real-audio-runtime-candidate -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Walk through terrain, attempt save and reload, capture screenshots
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-lifecycle.py 2>&1 | tee lifecycle-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-singleplayer-lifecycle-evidence
          path: |
            lifecycle-evidence/
            lifecycle-console.log
          if-no-files-found: warn
          retention-days: 7
