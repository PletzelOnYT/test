name: Build Acoustic Base Radar 1.21.1

on:
  push:
    branches:
      - feature/acoustic-base-radar-meteor-1-21-1
    paths:
      - 'acoustic-base-radar/**'
      - '.github/workflows/acoustic-base-radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acoustic-base-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Compile and remap addon
        run: gradle clean build --stacktrace --no-daemon
      - name: Package build and sources
        run: |
          mkdir -p dist
          cp build/libs/acoustic-base-radar-1.0.0.jar dist/acoustic-base-radar-1.0.0.jar
          zip -q -r dist/acoustic-base-radar-source.zip README.md build.gradle settings.gradle gradle.properties src
      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-base-radar-1.21.1
          path: |
            acoustic-base-radar/dist/acoustic-base-radar-1.0.0.jar
            acoustic-base-radar/dist/acoustic-base-radar-source.zip
          if-no-files-found: error
      - name: Publish build to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acoustic-base-radar/dist/acoustic-base-radar-1.0.0.jar acoustic-base-radar/dist/acoustic-base-radar-source.zip
          git commit -m 'Build Acoustic Base Radar 1.21.1 [skip ci]' || true
          git push origin HEAD:feature/acoustic-base-radar-meteor-1-21-1
        working-directory: .
