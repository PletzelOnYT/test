name: Build Acoustic Base Radar 1.21.1

on:
  push:
    branches:
      - feature/acoustic-base-radar-meteor-1-21-1
    paths:
      - 'acoustic-base-radar/**'
      - '.github/workflows/acoustic-base-radar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acoustic-base-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Compile and remap addon
        run: gradle clean build --stacktrace --no-daemon
      - name: Upload installable mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-base-radar-1.21.1
          path: acoustic-base-radar/build/libs/acoustic-base-radar-1.0.0.jar
          if-no-files-found: error
