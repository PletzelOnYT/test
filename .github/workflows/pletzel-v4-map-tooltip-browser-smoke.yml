name: Pletzel V4 Map Tooltip standalone real-browser regression (NO REBUILD)
on:
  push:
    branches: [pletzel-v4-map-tooltip-browser-evidence]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Await exact native Map Tooltip binary without duplicate build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=42731621617
          expected_sha=77d3163ce7069e56fc9cae7238a676b159adf469
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$expected_sha"
          deadline=$(( $(date +%s) + 4700 ))
          while true; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)"
            echo "Native Map Tooltip build $run: $status"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
              test "$conclusion" = success || { echo "Native build did not succeed: $conclusion"; exit 3; }
              break
            fi
            test "$(date +%s)" -lt "$deadline" || { echo "Native build did not finish before test timeout"; exit 4; }
            sleep 25
          done
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-map-tooltip-native-complete-html -D candidate
          test "$(find candidate -type f -name '*.html' | wc -l)" -eq 1
          find candidate -type f -name '*.html' -exec sha256sum {} \;
          test "$(find candidate -type f -name '*.html' -exec stat -c %s {} \;)" -gt 85000000
      - name: Install real Chromium/WebGL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0' pillow
          python -m playwright install --with-deps chromium
      - name: Check Map Tooltip build launch, existing native warning navigation, mouse and viewport resize
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x768x24' python pletzel-v4/test-map-tooltip-browser-smoke.py 2>&1 | tee real-browser.log
      - name: Preserve actual canvas screenshots, console errors, and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-map-tooltip-real-browser-ui-evidence
          path: |
            map-tooltip-ui-browser-evidence/
            real-browser.log
          if-no-files-found: warn
          retention-days: 21
