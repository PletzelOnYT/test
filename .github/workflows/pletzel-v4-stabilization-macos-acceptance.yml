name: Pletzel V4 26.2 exact HTML macOS-hosted real Chromium gameplay acceptance
on:
  push:
    branches: [pletzel-v4-stabilization-unified-voice-20261110]
    paths:
      - '.github/workflows/pletzel-v4-stabilization-macos-acceptance.yml'
      - 'pletzel-v4/accept-unified-live-tps.py'
      - 'pletzel-v4/accept-unified-file-offline.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  hosted-macos-gameplay:
    runs-on: macos-15
    timeout-minutes: 38
    env:
      CPU_MODE: normal
      PLETZEL_CI_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify macOS host, CPU and Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          sw_vers | tee hosted-mac-environment.txt
          sysctl -n machdep.cpu.brand_string | tee -a hosted-mac-environment.txt
          uname -a | tee -a hosted-mac-environment.txt
          sysctl -n hw.memsize | tee -a hosted-mac-environment.txt
      - name: Fetch exact voice-repaired standalone HTML from native four-mod build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=42937082477
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 091209f36bbaf93933dcf8d8ae0e4a6b8db3f1f3
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          mkdir -p candidate
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n pletzel-v4-all-four-mods-complete-html -D candidate
          test "$(find candidate -name '*.html' | wc -l)" -eq 1
          shasum -a 256 "$(find candidate -name '*.html' | head -1)" | tee hosted-macos-tested-sha256.txt
          grep -q '^8ded0acb2a1eb732015bebc6265297984392acf7d1b257ff2aafe52abcbf2f9a ' hosted-macos-tested-sha256.txt
      - name: Install Playwright and actual Chromium for macOS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.56.0' Pillow
          python -m playwright install chromium
      - name: Actual offline standalone HTML title boot using macOS Chromium
        shell: bash
        run: |
          set -o pipefail
          python -u pletzel-v4/accept-unified-file-offline.py 2>&1 | tee hosted-macos-offline-boot.log
      - name: Real macOS Chromium integrated-server world and tick endurance
        shell: bash
        run: |
          set -o pipefail
          python -u pletzel-v4/accept-unified-live-tps.py 2>&1 | tee hosted-macos-singleplayer-tps.log
      - name: Preserve exact browser pixels, trace and macOS details regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-macos-hosted-exact-html-gameplay-evidence
          path: |
            hosted-mac-environment.txt
            hosted-macos-tested-sha256.txt
            hosted-macos-*.log
            offline-file-url-evidence/
            live-tps-normal-evidence/
          if-no-files-found: warn
          retention-days: 21
