name: Pletzel V4 - Retain exact diagnostic HTML and source evidence for 90 days (NO BUILD)
on:
  push:
    branches: [pletzel-v4-vault-teleport-diagnostic-preservation-90d]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve-immutable-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover byte-identical exact diagnostic compiled candidate and log SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archive
          gh run download 42439505642 -R "$GITHUB_REPOSITORY" -n pletzel-v4-vault-teleport-diagnostic-html-candidate -D raw
          gh run download 42439505642 -R "$GITHUB_REPOSITORY" -n pletzel-v4-vault-teleport-diagnostic-compile-logs -D logs
          mapfile -t htmls < <(find raw -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          cp "${htmls[0]}" archive/eaglercraft-26.2-Pletzel-v4-VAULT-TELEPORT-DIAGNOSTIC-UNVERIFIED.html
          printf '%s  %s\n' 4a8bef5b7229580df7867bb6f62fce352842107a35082221d1cb6e5c517e5abd archive/*.html | sha256sum -c -
          grep -F '4a8bef5b7229580df7867bb6f62fce352842107a35082221d1cb6e5c517e5abd' logs/artifact-sha256.txt
          cp logs/artifact-sha256.txt archive/compiler-sha256.txt
          cp logs/wasm-validation.log archive/wasm-validation.log
          sha256sum archive/*.html > archive/independent-sha256.txt
          cat > archive/README.txt <<'TEXT'
          Pletzel V4 26.2 UNVERIFIED diagnostic compiled standalone HTML.
          This is NOT a FINAL release and MUST NOT be misrepresented as fixed.
          Original GitHub Actions compile 42439505642, head commit 96c1885022a287e944f0975e2fe1ea296a29a398.
          Native Schematica, fair scheduling, stream ACK backpressure, trial-spawner guard,
          villager AI guard, browser Vault-neighbor FULL preflight, and opt-in PletzelTeleportTrace.
          Exact compiled standalone HTML SHA256 4a8bef5b7229580df7867bb6f62fce352842107a35082221d1cb6e5c517e5abd.
          Current real gameplay acceptance workflow: 42440754224.
          Known PRIOR binaries: intermittent remote FULL waits and 4–6s Vault block-entity stalls.
          Do NOT claim the new guards solve them until browser tests are reviewed.
          Source and run checkpoints: https://github.com/PletzelOnYT/test/issues/1
          TEXT
      - uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-vault-teleport-diagnostic-immutable-90day
          path: archive/
          retention-days: 90
          if-no-files-found: error
