name: Pletzel V4 - Exact standalone HTML file URL gameplay
on:
  push:
    branches: [pletzel-v4-standalone-file-url-verify]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  file-url-survival:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify EXACT unchanged standalone HTML
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42408817655 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-singleplayer-engine-tpsed-html-candidate -D candidate
          mapfile -t files < <(find candidate -type f -name '*.html')
          test "${#files[@]}" -eq 1
          printf '%s  %s\n' '1c95670852c5e1241cd78fd6646b8091ebb4aed81d5eafac32dc0761e01fc6ef' "${files[0]}" | sha256sum --check
          sha256sum "${files[0]}" | tee input-html-sha256.txt
      - name: Install Chromium and real WebGL2 test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Change only the TEST NAVIGATION URL to file protocol
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pletzel-v4-singleplayer-pressure.py')
          s=p.read_text()
          old='url=f"http://127.0.0.1:{httpd.server_address[1]}/{html.name}?perfdebug"'
          new="url=html.as_uri() + '?perfdebug'"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          print('Test-only edit: browsing via file:// instead of HTTP. Standalone HTML unchanged.')
          PY
      - name: Run full Survival TPS and screenshot test direct from file URL
        env:
          GAMEPLAY_SECONDS: '185'
          PIN_ONE_CPU: '0'
          CPU_SLOWDOWN: '1'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-singleplayer-pressure.py 2>&1 | tee verification-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-exact-file-url-survival-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            input-html-sha256.txt
            verification-console.log
            singleplayer-pressure-evidence/
