name: Pletzel V4 - Actual Survival chicken authority with cheats enabled
on:
  push:
    branches: [pletzel-v4-cheats-enabled-entity-proof]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-survival-cheats:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download EXACT async engine binary, never rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42408817655 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-singleplayer-engine-tpsed-html-candidate -D candidate
          mapfile -t htmls < <(find candidate -type f -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' '1c95670852c5e1241cd78fd6646b8091ebb4aed81d5eafac32dc0761e01fc6ef' "${htmls[0]}" | sha256sum --check
          sha256sum "${htmls[0]}" > candidate-sha256.txt
      - name: Install real Chromium and WebGL2 / IndexedDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Create NORMAL Survival world, enable cheats in vanilla UI, measure actual entity states
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-cheats-entity-proof.py 2>&1 | tee proof-console.log
      - name: Always upload actual evidence, never treat sent command as successful without visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-cheats-on-entity-authority
          path: |
            candidate-sha256.txt
            proof-console.log
            cheats-entity-evidence/
          if-no-files-found: warn
          retention-days: 30
