name: Pletzel V4 real-origin browser gameplay smoke
on:
  push:
    branches:
      - pletzel-v4-schematica-browser-smoke
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Playwright Chromium and virtual display
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Fetch last verified compiled V4 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download 42342196510 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-build-intermediate-needs-v3-sounds -D candidate
          find candidate -maxdepth 3 -type f -printf '%p %s bytes\\n' | head -15
          test "$(find candidate -type f -name '*Schematica*CANDIDATE.html' | wc -l)" -eq 1
      - name: Test Minecraft in true localhost origin with WebGL2 and IndexedDB
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-browser-smoke.py 2>&1 | tee smoke-console.log
      - name: Save screenshots, errors, and file chooser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-browser-smoke-evidence
          path: |
            smoke-evidence/
            smoke-console.log
          retention-days: 7
          if-no-files-found: warn
