name: Pletzel V4 - Reproduce real singleplayer TPS bottleneck on constrained Chromium
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pressure:
    strategy:
      fail-fast: false
      matrix:
        cpu_slowdown: ['1', '3']
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download EXACT successful 26.2 root build, never modified for testing
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh run download 42392345185 -R "${GITHUB_REPOSITORY}" -n pletzel-v4-singleplayer-root-fixed-html-candidate -D candidate
          file=$(find candidate -name '*.html' | head -1)
          echo "510c41635be41ff62ac1ebe05eb0b810ca7d6dcacfcfc0d2150c3e56378f0e5d  $file" | sha256sum -c -
      - name: Install WebGL2 and IndexedDB Chromium test runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Create normal Survival world, keep moving and sample actual server ticks
        env:
          CPU_SLOWDOWN: '${{ matrix.cpu_slowdown }}'
          GAMEPLAY_SECONDS: '185'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python pletzel-v4-singleplayer-pressure.py 2>&1 | tee pressure-console.log
      - name: Preserve tick/worker/chunk evidence even if world fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pletzel-v4-survival-pressure-cpu-${{ matrix.cpu_slowdown }}
          path: |
            singleplayer-pressure-evidence/
            pressure-console.log
          retention-days: 7
          if-no-files-found: warn
