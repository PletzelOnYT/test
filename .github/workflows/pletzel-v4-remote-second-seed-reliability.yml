name: Pletzel V4 - Independent second-seed 2-leg distant FULL acceptance, exact diagnostic HTML
on:
  push:
    branches: [pletzel-v4-remote-reliability-second-seed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  strict-second-seed-f3-terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      TEST_KIND: remote
      WORLD_SEED: '987654321'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify EXACT successful previously compiled HTML binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download 42439505642 -R "$GITHUB_REPOSITORY" -n pletzel-v4-vault-teleport-diagnostic-html-candidate -D candidate
          mapfile -t htmls < <(find candidate -name '*.html')
          test "${#htmls[@]}" -eq 1
          printf '%s  %s\n' 4a8bef5b7229580df7867bb6f62fce352842107a35082221d1cb6e5c517e5abd "${htmls[0]}" | sha256sum -c -
          sha256sum "${htmls[0]}" | tee candidate-sha256.txt
          python3 -m py_compile vault-acceptance/pletzel-v4-diagnostic-remote-teleport.py vault-acceptance/strict-evidence-gate.py
      - name: Install Chromium WebGL2 WebAssembly-GC and IndexedDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Create DIFFERENT normal Survival seed, spectator then two sequential distant FULL chunk teleports
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python vault-acceptance/pletzel-v4-diagnostic-remote-teleport.py 2>&1 | tee browser-console.log
      - name: Require authoritative X positions 96.5 then 192.5 and native future tracing
        shell: bash
        run: python vault-acceptance/strict-evidence-gate.py | tee strict-evidence-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pletzel-v4-remote-second-seed-independent-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            candidate-sha256.txt
            browser-console.log
            strict-evidence-console.log
            strict-evidence-gate.json
            cheats-entity-evidence/
